  const nuovi = clientiMancanti();
  if (!nuovi.length) { avvisa('Nessun cliente nuovo nei rapportini'); return; }
  CLIENTI = CLIENTI.concat(nuovi.map(sistemaCliente));
  CLIENTI_DA_SALVARE = true;
  if (!(await salvaClienti())) return;
  disegnaClienti();
  avvisa(nuovi.length === 1 ? 'Un cliente aggiunto' : nuovi.length + ' clienti aggiunti');
}

// Importare non sovrascrive: un cliente che c'è già resta com'è. L'ufficio ci ha
// messo dentro numeri di telefono che il telefono non conosce, e un'importazione
// che riscrive li cancellerebbe a ogni giro.
async function importaAnagrafica() {
  let doc;
  try {
    doc = JSON.parse(await leggiTesto(CARTELLA, FILE_ANAGRAFICA));
  } catch (e) {
    avvisa('Non trovo ' + FILE_ANAGRAFICA + ' nella cartella: esportala da ⚙️ Dati sul telefono', true);
    return;
  }
  if (!doc || doc.tipo !== 'anagrafica' || !Array.isArray(doc.clienti)) {
    avvisa('Quel file non è un\'anagrafica del telefono', true);
    return;
  }
  const nuovi = doc.clienti.filter(c => c.id && !CLIENTI.some(x => x.id === c.id));
  if (!nuovi.length) {
    avvisa('Nessun cliente nuovo: ci sono già tutti');
    return;
  }
  CLIENTI = CLIENTI.concat(nuovi.map(sistemaCliente));
  CLIENTI_DA_SALVARE = true;
  if (!(await salvaClienti())) return;
  disegnaClienti();
  avvisa(nuovi.length === 1 ? 'Un cliente importato' : nuovi.length + ' clienti importati');
}

// ── LA LAVAGNA ──
// Non è un calendario. È la lavagna che in ufficio si tiene a matita: a sinistra
// quello che c'è da fare e non ha ancora una data, a destra la settimana spezzata
// in mezze giornate. Niente si muove da solo — nemmeno passando di settimana.

// lunediDellaSettimana, numeroSettimana ed etichettaSettimana stanno in
// rapportino.js: le usano tutte e due le app, e due idee diverse di «quale
// settimana» sarebbero peggio di nessuna. Qui restano le due che servono a
// muoversi avanti e indietro, che lavorano su oggetti Date.

function lunediDi(data) {
  return new Date(lunediDellaSettimana(data) + 'T12:00:00');
}

function isoData(d) {
  const x = new Date(d);
  x.setHours(12, 0, 0, 0);
  return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') +
    '-' + String(x.getDate()).padStart(2, '0');
}

function cambiaSettimana(passo) {
  const d = new Date(SETTIMANA);
  d.setDate(d.getDate() + passo * 7);
  SETTIMANA = lunediDi(d);
  disegnaLavagna();
}

function questaSettimana() {
  SETTIMANA = lunediDi(new Date());
  disegnaLavagna();
}

const bloccato = l => l.requisiti.length > 0;

// Un lavoro previsto per una settimana che deve ancora arrivare non è «da
// pianificare»: è solo rumore in cima alla colonna, e settimana dopo settimana
// la colonna diventava un elenco di cose che non si potevano ancora toccare.
// Senza settimana invece si vede sempre: non ha un momento suo, quindi è adesso.
const perPiuAvanti = (l, settimanaMostrata) =>
  !!l.settimana && !!settimanaMostrata && l.settimana > settimanaMostrata;

// Il riferimento è la settimana che si sta guardando, non l'oggi: il pallino
// nella barra e la colonna devono dire la stessa cosa, o uno dei due mente.
function daPianificareOra() {
  const riferimento = SETTIMANA ? isoData(SETTIMANA) : lunediDellaSettimana(new Date());
  return LAVAGNA.lavori.filter(l => !piazzato(l) && !perPiuAvanti(l, riferimento));
}
const piazzato = l => l.stato !== 'lista' && !!l.giorno && !!l.mezza;
const mezzeOccupate = l => Math.max(1, Number(l.mezze) || 1);

function mezzeDa(giorno, mezza, quante) {
  const elenco = [];
  const d = new Date(giorno + 'T12:00:00');
  let m = mezza === 'pomeriggio' ? 1 : 0;
  let giri = 0;
  while (elenco.length < quante && giri < 60) {
    giri++;
    // La domenica non si lavora: un lavoro lungo la salta invece di finirci dentro.
    if (d.getDay() !== 0) elenco.push({ giorno: isoData(d), mezza: MEZZE[m] });
    if (m === 1) { d.setDate(d.getDate() + 1); m = 0; } else { m = 1; }
  }
  return elenco;
}

function copertura(l) {
  if (!piazzato(l)) return [];
  return mezzeDa(l.giorno, l.mezza, mezzeOccupate(l));
}

// Le ore si spalmano per quante mezze giornate occupa: sono un'indicazione per
// chi guarda la colonna, non un vincolo. È l'utente a dire quanto è largo il
// lavoro, e le ore lo seguono — non il contrario.
function oreNellaMezza(l, giorno, mezza) {
  const c = copertura(l);
  if (!c.some(x => x.giorno === giorno && x.mezza === mezza)) return 0;
  return Number(((Number(l.ore) || 0) / c.length).toFixed(2));
}

// Tre regole per la coda: quello che non si può fare va in fondo, quello che è già
// slittato va in cima, e per il resto conta chi scade prima. Dentro i giorni non
// si ordina niente: lì l'ordine è quello che gli dà chi pianifica.
function ordinaCoda(a, b) {
  if (bloccato(a) !== bloccato(b)) return bloccato(a) ? 1 : -1;
  if (a.rimandato !== b.rimandato) return a.rimandato ? -1 : 1;
  if (!a.settimana !== !b.settimana) return a.settimana ? -1 : 1;
  return String(a.settimana).localeCompare(String(b.settimana));
}

function cartellino(l) {
  const classi = ['cartellino'];
  if (piazzato(l)) classi.push(l.stato);
  if (bloccato(l)) classi.push('bloccato');
  const inLista = !piazzato(l);
  const mezze = mezzeOccupate(l);
  const c = copertura(l);
  const ultimoGiorno = c.length ? c[c.length - 1].giorno : '';
  const sabato = isoData(new Date(new Date(SETTIMANA).setDate(SETTIMANA.getDate() + 5)));
  const id = perOnclick(l.id);

  return '<article class="' + classi.join(' ') + '" draggable="true"' +
      ' ondragstart="iniziaTrascino(event, \'' + id + '\')"' +
      (piazzato(l) ? ' onclick="cambiaPenna(\'' + id + '\')"' : '') +
      ' title="' + (piazzato(l) ? 'Un clic per confermare o tornare a matita' : 'Trascinalo in una mezza giornata') + '">' +
    '<div class="cliente-cart">' + perValore(l.cliente || 'senza nome') + '</div>' +
    (l.luogo ? '<div class="luogo-cart">' + perValore(l.luogo) + '</div>' : '') +
    (l.cosa ? '<div class="cosa-cart">' + perValore(l.cosa) + '</div>' : '') +
    '<div class="riga-cart">' +
      (l.ore ? '<span class="ore-cart">~' + formattaQuantita(l.ore) + ' h</span>' : '') +
      (l.rimandato && inLista ? '<span class="rimandato-cart">slittato</span>' : '') +
      (inLista && l.settimana ? '<span class="quando-cart">' + perValore(etichettaSettimana(l.settimana)) + '</span>' : '') +
      l.requisiti.map(r => '<span class="requisito-cart">⚠ ' + perValore(r) + '</span>').join('') +
      (piazzato(l) ? '<span class="larghezza-cart">' +
        '<button type="button" class="bottone-cart" onclick="event.stopPropagation(); stringi(\'' + id + '\')"' +
          (mezze === 1 ? ' disabled' : '') + ' title="Una mezza giornata in meno">−</button>' +
        '<span class="mezze-cart">' + mezze + (mezze === 1 ? ' mezza' : ' mezze') + '</span>' +
        '<button type="button" class="bottone-cart" onclick="event.stopPropagation(); allarga(\'' + id + '\')"' +
          ' title="Allarga alla mezza giornata successiva">+</button>' +
        '</span>' : '') +
      (inLista && l.origine ? '<span class="origine-cart">' + perValore(l.origine) + '</span>' : '') +
      (inLista ? '<button type="button" class="bottone-cart" style="margin-left:auto"' +
        ' onclick="event.stopPropagation(); apriModuloLavoro(\'' + id + '\')" title="Modifica">✎</button>' +
        '<button type="button" class="bottone-cart"' +
        ' onclick="event.stopPropagation(); togliDallaLavagna(\'' + id + '\')" title="Togli dalla lavagna">✕</button>' : '') +
    '</div>' +
    (ultimoGiorno && ultimoGiorno > sabato ? '<div class="sconfina-cart">continua la settimana prossima</div>' : '') +
  '</article>';
}

function disegnaLavagna() {
  const c = document.getElementById('pagina-lavagna');
  if (!CARTELLA) { c.innerHTML = schermataBenvenuto(); return; }
  if (!SETTIMANA) SETTIMANA = lunediDi(new Date());

  const giorni = [0, 1, 2, 3, 4, 5].map(i => {
    const d = new Date(SETTIMANA);
    d.setDate(SETTIMANA.getDate() + i);
    return d;
  });
  const primo = giorni[0].toLocaleDateString('it-IT', { day: 'numeric', month: 'long' });
  const ultimo = giorni[5].toLocaleDateString('it-IT', { day: 'numeric', month: 'long', year: 'numeric' });

  let html = '<div class="testata-lavagna">' +
    '<div><h2 class="titolo-pagina" style="margin:0">Lavagna</h2></div>' +
    '<button class="freccia-sett" onclick="cambiaSettimana(-1)" title="Settimana precedente">←</button>' +
    '<div><div class="settimana-num">Settimana ' + numeroSettimana(SETTIMANA) + '</div>' +
      '<div class="settimana-date">' + primo + ' – ' + ultimo + '</div></div>' +
    '<button class="freccia-sett" onclick="cambiaSettimana(1)" title="Settimana successiva">→</button>' +
    '<button class="secondaria piccola" onclick="questaSettimana()">Oggi</button>' +
  '</div>';

  html += '<div class="tavolo">';

  // ── la colonna di sinistra: quello che c'è da fare e non ha una data ──
  const settimanaMostrata = isoData(SETTIMANA);
  const tuttaLaCoda = LAVAGNA.lavori.filter(l => !piazzato(l)).sort(ordinaCoda);
  const piuAvanti = tuttaLaCoda.filter(l => perPiuAvanti(l, settimanaMostrata));
  const inCoda = MOSTRA_FUTURI ? tuttaLaCoda : tuttaLaCoda.filter(l => !perPiuAvanti(l, settimanaMostrata));
  const rimasti = inCoda.filter(l => l.rimandato).length;
  const prenotati = inCoda.filter(l => l.origine === 'prenotato dal cantiere' && !l.rimandato).length;
  html += '<section class="coda"><h3 class="titolo-colonna">Da pianificare</h3>';
  if (prenotati) {
    html += '<div class="rimasti" style="background:var(--green-mist); border-color:var(--green-light); color:var(--green-deep)">' +
      '📨 ' + prenotati + (prenotati === 1 ? ' prenotazione arrivata' : ' prenotazioni arrivate') + ' dal cantiere</div>';
  }
  if (rimasti) {
    html += '<div class="rimasti">⚠ ' + rimasti +
      (rimasti === 1 ? ' lavoro è slittato' : ' lavori sono slittati') +
      ' e aspettano<button class="bottone-cart" style="margin-left:auto" onclick="hoVisto()">Ho visto</button></div>';
  }
  html += '<div class="coda-lista" ondragover="sopraZona(event, this)" ondragleave="fuoriZona(this)"' +
    ' ondrop="rilascia(event, this, \'\', \'\')">' +
    (inCoda.length ? inCoda.map(cartellino).join('')
      : '<div class="vuoto-mezza">Niente in attesa.<br>Quello che arriva dai rapportini compare qui.</div>') +
    '</div>';
  // Nascondere qualcosa senza dire quanto e senza un modo per guardarlo è il
  // tipo di aiuto che fa perdere un lavoro: il conto sta lì, e si apre.
  if (piuAvanti.length || MOSTRA_FUTURI) {
    html += '<div class="piu-avanti">' +
      (piuAvanti.length
        ? piuAvanti.length + (piuAvanti.length === 1 ? ' lavoro è per una settimana dopo' : ' lavori sono per le settimane dopo')
        : 'Niente per le settimane dopo') +
      '<button class="bottone-cart" style="margin-left:auto" onclick="mostraFuturi()">' +
      (MOSTRA_FUTURI ? 'Nascondi' : 'Mostra') + '</button></div>';
  }
  html += '<div class="bottoni">' +
    '<button class="secondaria piccola" onclick="apriModuloLavoro()">+ Aggiungi</button>' +
    '<button class="secondaria piccola" onclick="importaProssimi()"' +
      ' title="Cerca nei rapportini i prossimi interventi segnati in cantiere">Prendi i prossimi interventi</button>' +
  '</div>';
  html += '<div id="nuovo-lavoro"></div>';
  html += '</section>';

  // ── la settimana ──
  html += '<section class="giorni">';
  giorni.forEach((d, i) => {
    const iso = isoData(d);
    const classi = ['giorno'];
    if (iso === isoData(new Date())) classi.push('oggi');
    if (i === 5) classi.push('sabato');
    let oreGiorno = 0;
    let mezze = '';
    MEZZE.forEach(mezza => {
      const inizia = LAVAGNA.lavori.filter(l => piazzato(l) && l.giorno === iso && l.mezza === mezza);
      const seguiti = LAVAGNA.lavori.filter(l => piazzato(l) && !(l.giorno === iso && l.mezza === mezza) &&
        copertura(l).some(x => x.giorno === iso && x.mezza === mezza));
      const ore = LAVAGNA.lavori.reduce((s, l) => s + oreNellaMezza(l, iso, mezza), 0);
      oreGiorno += ore;
      const dentro = inizia.map(cartellino).join('') +
        seguiti.map(l => '<div class="seguito-cart">↳ ' + perValore(l.cliente) + ', continua</div>').join('');
      mezze += '<div class="mezza">' +
        '<div class="mezza-etichetta"><span>' + mezza + '</span>' +
          (ore ? '<b>' + formattaQuantita(ore) + ' h</b>' : '') + '</div>' +
        '<div class="mezza-corpo" ondragover="sopraZona(event, this)" ondragleave="fuoriZona(this)"' +
          ' ondrop="rilascia(event, this, \'' + iso + '\', \'' + mezza + '\')">' +
          (dentro || '<div class="vuoto-mezza">—</div>') +
        '</div></div>';
    });
    html += '<div class="' + classi.join(' ') + '">' +
      '<div class="giorno-testa"><span class="giorno-nome">' + NOMI_GIORNI[i] + '</span>' +
        '<span class="giorno-data">' + d.getDate() + '/' + (d.getMonth() + 1) + '</span></div>' +
      mezze +
      '<div class="giorno-piede"><span>' + (i === 5 ? 'a disposizione' : 'giornata') + '</span>' +
        '<b>' + formattaQuantita(oreGiorno) + ' h</b></div>' +
    '</div>';
  });
  html += '</section></div>';

  // In fondo: serve quando non ti ricordi cosa vuol dire un tratteggio, e chi non
  // se lo sta chiedendo non deve scavalcarla per arrivare alla lavagna.
  html += '<div class="legenda-lavagna">' +
    '<span><i class="campione matita"></i><b>A matita</b> — previsto, il cliente non lo sa</span>' +
    '<span><i class="campione penna"></i><b>Confermato</b> — il cliente sa che arrivate</span>' +
    '<span><i class="campione bloccato"></i><b>Bloccato</b> — manca qualcosa per poterlo fare</span>' +
    '<span>Un clic sul cartellino conferma · <b>+</b> e <b>−</b> allargano il lavoro di mezza giornata</span>' +
  '</div>';

  c.innerHTML = html;
}

// ── trascinare ──

function iniziaTrascino(e, id) {
  TRASCINATO = id;
  if (e.dataTransfer) e.dataTransfer.effectAllowed = 'move';
}

function sopraZona(e, zona) { e.preventDefault(); zona.classList.add('sopra'); }
function fuoriZona(zona) { zona.classList.remove('sopra'); }

async function rilascia(e, zona, giorno, mezza) {
  e.preventDefault();
  zona.classList.remove('sopra');
  await spostaLavoro(TRASCINATO, giorno, mezza);
  TRASCINATO = null;
}

async function spostaLavoro(id, giorno, mezza) {
  const l = LAVAGNA.lavori.find(x => x.id === id);
  if (!l) return;
  // Togliere o spostare un confermato vuol dire che qualcuno deve telefonare al
  // cliente: non può succedere per un trascinamento distratto.
  if (l.stato === 'confermato' && (l.giorno !== giorno || l.mezza !== mezza)) {
    const cosa = giorno ? 'lo sposti' : 'lo rimetti in attesa';
    if (!confirm(l.cliente + ' è confermato: il cliente sa che arrivate.\n\n' +
      'Se ' + cosa + ' bisogna avvisarlo. Procedere?')) return;
  }
  if (!giorno) {
    l.stato = 'lista'; l.giorno = ''; l.mezza = ''; l.mezze = 1;
    l.rimandato = true;   // era già stato programmato: torna in cima alla coda
  } else {
    if (l.giorno === giorno && l.mezza === mezza) return;
    l.giorno = giorno; l.mezza = mezza;
    if (l.stato === 'lista') l.stato = 'matita';
    l.rimandato = false;
  }
  await salvaLavagna();
  disegnaLavagna();
}

async function cambiaPenna(id) {
  const l = LAVAGNA.lavori.find(x => x.id === id);
  if (!l || !piazzato(l)) return;   // nella coda non esiste né matita né penna
  l.stato = l.stato === 'matita' ? 'confermato' : 'matita';
  await salvaLavagna();
  disegnaLavagna();
}

// Un passo per volta, in tutte e due le direzioni: è il modo in cui si allarga
// un appuntamento sulla lavagna vera, con la matita.
async function allarga(id) {
  const l = LAVAGNA.lavori.find(x => x.id === id);
  if (!l) return;
  l.mezze = mezzeOccupate(l) + 1;
  await salvaLavagna();
  disegnaLavagna();
}

async function stringi(id) {
  const l = LAVAGNA.lavori.find(x => x.id === id);
  if (!l || mezzeOccupate(l) <= 1) return;
  l.mezze = mezzeOccupate(l) - 1;
  await salvaLavagna();
  disegnaLavagna();
}

async function togliDallaLavagna(id) {
  const l = LAVAGNA.lavori.find(x => x.id === id);
  if (!l) return;
  if (!confirm('Togliere «' + (l.cliente || 'senza nome') + ' — ' + (l.cosa || '') + '» dalla lavagna?')) return;
  LAVAGNA.lavori = LAVAGNA.lavori.filter(x => x.id !== id);
  await salvaLavagna();
  disegnaLavagna();
}

function mostraFuturi() {
  MOSTRA_FUTURI = !MOSTRA_FUTURI;
  disegnaLavagna();
}

async function hoVisto() {
  LAVAGNA.lavori.forEach(l => { if (!piazzato(l)) l.rimandato = false; });
  await salvaLavagna();
  disegnaLavagna();
}

// ── aggiungere ──

// Lo stesso modulo per aggiungere e per correggere: quello che si sbaglia
// scrivendo si sbaglia anche importando, e senza una via per rimetterci mano
// l'unica strada sarebbe cancellare e riscrivere.
function apriModuloLavoro(id) {
  const c = document.getElementById('nuovo-lavoro');
  if (!c) return;
  const l = id ? LAVAGNA.lavori.find(x => x.id === id) : null;
  if (id && !l) return;
  const v = campo => perValore(l ? l[campo] : '');
  c.innerHTML = '<div class="scheda" style="margin-top:10px">' +
    '<div class="titolo-sezione">' + (l ? 'Correggi il lavoro' : 'Un lavoro nuovo') + '</div>' +
    '<input type="hidden" id="n-id" value="' + perValore(id || '') + '">' +
    '<input type="text" id="n-cliente" placeholder="Cliente" value="' + v('cliente') + '" style="margin-bottom:6px">' +
    '<input type="text" id="n-luogo" placeholder="Dove" value="' + v('luogo') + '" style="margin-bottom:6px">' +
    '<input type="text" id="n-cosa" placeholder="Cosa c\'è da fare" value="' + v('cosa') + '" style="margin-bottom:6px">' +
    '<input type="text" id="n-ore" placeholder="Stima ore" value="' +
      perValore(l && l.ore ? formattaQuantita(l.ore) : '') + '" style="margin-bottom:6px">' +
    '<input type="date" id="n-settimana" value="' + v('settimana') + '" style="margin-bottom:6px"' +
      ' title="In che settimana" oninput="ecoSettimanaLavoro()">' +
    '<div id="n-settimana-eco" class="meta" style="margin-bottom:6px">' +
      perValore(etichettaSettimana(l ? l.settimana : '')) + '</div>' +
    '<input type="text" id="n-requisito" placeholder="Manca qualcosa? (blocca il lavoro)" value="' +
      perValore(l && l.requisiti.length ? l.requisiti.join(', ') : '') + '">' +
    '<div class="bottoni">' +
      '<button class="principale piccola" onclick="salvaModuloLavoro()">' +
        (l ? 'Salva' : 'Metti in coda') + '</button>' +
      '<button class="secondaria piccola" onclick="chiudiModuloLavoro()">Annulla</button>' +
    '</div></div>';
  document.getElementById('n-cliente').focus();
}

// Si sceglie un giorno qualunque e conta la sua settimana. Sotto al campo
// compare quale, o si finisce per credere di aver fissato una data.
function ecoSettimanaLavoro() {
  const eco = document.getElementById('n-settimana-eco');
  if (!eco) return;
  const scelto = (document.getElementById('n-settimana') || {}).value || '';
  eco.textContent = scelto ? etichettaSettimana(lunediDellaSettimana(scelto)) : '';
}

function chiudiModuloLavoro() {
  const c = document.getElementById('nuovo-lavoro');
  if (c) c.innerHTML = '';
}

async function salvaModuloLavoro() {
  const valore = id => (document.getElementById(id) || {}).value || '';
  const cliente = valore('n-cliente').trim();
  if (!cliente) { avvisa('Serve almeno il cliente', true); return; }
  const requisiti = valore('n-requisito').split(',').map(r => r.trim()).filter(r => r);
  const campi = {
    cliente, luogo: valore('n-luogo').trim(), cosa: valore('n-cosa').trim(),
    ore: Number(valore('n-ore').replace(',', '.')) || 0,
    settimana: lunediDellaSettimana(valore('n-settimana')),
    requisiti,
  };

  const id = valore('n-id');
  const esistente = id ? LAVAGNA.lavori.find(x => x.id === id) : null;
  if (esistente) {
    // Si riparte da quello che c'era: il modulo non conosce dove sta sulla
    // settimana né se è confermato, e ricostruirlo da zero lo staccherebbe.
    Object.assign(esistente, campi);
  } else {
    LAVAGNA.lavori.push(sistemaLavoro({ ...campi, origine: 'aggiunto in ufficio', stato: 'lista' }));
  }
  if (!(await salvaLavagna())) return;
  chiudiModuloLavoro();
  disegnaLavagna();
  avvisa(esistente ? 'Corretto: ' + cliente : 'In coda: ' + cliente);
}

// Il cantiere segna già il prossimo intervento su ogni visita: è l'unico canale che
// dal campo arriva in ufficio, e sarebbe sciocco farlo riscrivere a mano. Ogni
// rapportino letto finisce in «visti», così quello che l'ufficio ha già deciso di
// scartare non ricompare al giro dopo.
async function importaProssimi() {
  const nuovi = [];
  // Anche i rapportini appena arrivati, non solo quelli archiviati: il prossimo
  // intervento lo si legge quando arriva, non dopo aver chiuso il conto, e
  // guardare solo l'archivio faceva sembrare il bottone rotto.
  const documenti = ARRIVI.map(a => a.doc)
    .concat(ARCHIVIO.map(l => l.rapportino).filter(r => r));
  const gia = new Set();
  documenti.forEach(r => {
    if (!r || !r.id || gia.has(r.id)) return;
    gia.add(r.id);
    if (!r.prossimo || !String(r.prossimo.cosa || '').trim()) return;
    if (LAVAGNA.visti.includes(r.id)) return;
    LAVAGNA.visti.push(r.id);
    const anno = String(r.prossimo.anno || '').trim();
    nuovi.push(sistemaLavoro({
      cliente: (r.cliente && r.cliente.nome) || '',
      luogo: (r.cliente && r.cliente.citta) || '',
      cosa: r.prossimo.cosa,
      settimana: settimanaDaMeseAnno(r.prossimo.mese, anno),
      origine: 'dal cantiere',
      stato: 'lista',
      da: r.id,
    }));
  });
  if (!nuovi.length) {
    // Anche «niente di nuovo» va detto: senza, il bottone sembra rotto.
    await salvaLavagna();
    avvisa(documenti.length
      ? 'Nessun prossimo intervento nuovo: i rapportini letti non ne hanno, o li hai già presi'
      : 'Nessun rapportino nella cartella da cui prenderli');
    return;
  }
  LAVAGNA.lavori = LAVAGNA.lavori.concat(nuovi);
  if (!(await salvaLavagna())) return;
  disegnaLavagna();
  avvisa(nuovi.length === 1 ? 'Un lavoro messo in coda' : nuovi.length + ' lavori messi in coda');
}

const MESI = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno',
  'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'];

// Sul telefono il mese del prossimo intervento è il valore di una select, cioè
// "03" e non "marzo": è quello che viaggia nel rapportino. Si accetta anche il nome
// scritto, perché un backup vecchio può contenere di tutto.
function indiceMese(mese) {
  const t = String(mese || '').trim().toLowerCase();
  if (!t) return -1;
  const n = Number(t);
  if (n >= 1 && n <= 12) return n - 1;
  return MESI.indexOf(t);
}

function nomeMese(mese) {
  const i = indiceMese(mese);
  return i < 0 ? String(mese || '') : MESI[i];
}

// Il cantiere segna mese e anno; la coda ragiona per settimane. Si prende la
// settimana in cui cade il primo del mese: non è una scadenza, è un posto in
// fila, e chi pianifica la sposta dove vuole.
function settimanaDaMeseAnno(mese, anno) {
  const i = indiceMese(mese);
  const a = Number(anno);
  if (i < 0 || !a) return '';
  return lunediDellaSettimana(new Date(a, i, 1));
}

// ── LISTINO ──

function disegnaListino() {
  const c = document.getElementById('pagina-listino');
  if (!CARTELLA) { c.innerHTML = schermataBenvenuto(); return; }

  let html = '<h2 class="titolo-pagina">Listino</h2>';
  html += '<p class="sottotitolo">I prezzi stanno qui, non sul telefono: si correggono in un posto solo</p>';

  html += '<div id="listino-da-salvare" class="avvertenza" style="display:' +
    (LISTINO_DA_SALVARE ? 'block' : 'none') + '">' +
    'Ci sono modifiche non ancora scritte su file. Restano qui finché premi Salva il listino.</div>';

  html += '<div class="scheda">';
  html += '<table class="elenco"><thead><tr><th>Voce</th><th>Unità</th>' +
    '<th class="num">Prezzo</th><th>A corpo</th><th></th></tr></thead><tbody>';
  if (!LISTINO.voci.length) {
    html += '<tr><td colspan="5"><div class="vuoto-elenco">Listino vuoto. ' +
      'Le voci arrivano dai rapportini: aggiungile qui col nome che hanno lì.</div></td></tr>';
  }
  LISTINO.voci.forEach(v => {
    const id = perOnclick(v.voceID);
    html += '<tr>' +
      '<td><input type="text" value="' + perValore(v.voce) +
        '" oninput="modificaVoce(\'' + id + '\', \'voce\', this.value)"></td>' +
      '<td><input type="text" style="width:90px" value="' + perValore(v.unita) +
        '" oninput="modificaVoce(\'' + id + '\', \'unita\', this.value)"></td>' +
      '<td class="num"><input type="text" class="prezzo' + (v.prezzo === '' || v.prezzo == null ? ' vuoto' : '') +
        '" value="' + perValore(formattaQuantita(v.prezzo)) +
        '" oninput="modificaVoce(\'' + id + '\', \'prezzo\', this.value)"></td>' +
      '<td><input type="checkbox" style="width:auto"' + (v.aCorpo ? ' checked' : '') +
        ' onchange="segnaACorpo(\'' + id + '\', this.checked)"></td>' +
      '<td class="num"><button class="pericolo piccola" onclick="eliminaVoce(\'' + id + '\')">✕</button></td>' +
    '</tr>';
  });
  html += '</tbody></table>';
  html += '<div class="avvertenza">Un prezzo vuoto non è un errore: vuol dire che quella voce ' +
    'si valuta volta per volta. Il trasferimento e il trattamento fitosanitario funzionano così.</div>';
  html += '<div class="bottoni">' +
    '<button class="secondaria" onclick="aggiungiVoce()">+ Aggiungi una voce</button>' +
    '<button class="principale" onclick="salvaListino()">Salva il listino</button>' +
  '</div>';
  html += '</div>';

  const nonInListino = vociMancanti();
  if (nonInListino.length) {
    html += '<div class="scheda"><div class="titolo-sezione">Voci viste nei rapportini e non in listino</div>';
    html += '<p class="meta">Finché non hanno un prezzo qui, restano fuori dai totali.</p>';
    html += '<table class="elenco"><tbody>';
    nonInListino.forEach(v => {
      html += '<tr><td>' + perValore(v.voce) + '</td><td class="meta">' + perValore(v.unita) + '</td>' +
        '<td class="num"><button class="secondaria piccola" onclick="importaVoce(\'' +
          perOnclick(v.voceID) + '\', \'' + perOnclick(v.voce) + '\', \'' + perOnclick(v.unita) +
          '\')">Aggiungi in listino</button></td></tr>';
    });
    html += '</tbody></table></div>';
  }

  c.innerHTML = html;
}

// Le voci del conto nascono sul telefono, e il listino dell'ufficio parte vuoto:
// invece di farle riscrivere a mano, si prendono da quello che è già arrivato.
function vociMancanti() {
  const viste = new Map();
  const daDoc = d => (d.righe || []).forEach(r => {
    if (!r.voceID || voceInListino(r.voceID) || viste.has(r.voceID)) return;
    viste.set(r.voceID, { voceID: r.voceID, voce: r.voce || '', unita: r.unita || '' });
  });
  ARRIVI.forEach(a => daDoc(a.doc));
  ARCHIVIO.forEach(l => { if (l.rapportino) daDoc(l.rapportino); });
  return [...viste.values()];
}

function importaVoce(voceID, voce, unita) {
  if (voceInListino(voceID)) return;
  LISTINO.voci.push({ voceID, voce, unita, prezzo: '', aCorpo: false });
  LISTINO_DA_SALVARE = true;
  disegna();
}

// ── AVVIO ──

async function avvia() {
  const maniglia = await maniglieRicordate();
  if (maniglia && (await permessoConcesso(maniglia, false))) {
    await usaCartella(maniglia);
    return;
  }
  if (maniglia) {
    // La cartella c'è ancora ma il permesso è scaduto: serve un clic, non una
    // nuova scelta della cartella.
    document.getElementById('pagina-arrivi').innerHTML =
      '<h2 class="titolo-pagina">Bentornato</h2>' +
      '<p class="sottotitolo">La cartella è ancora quella, serve solo il tuo permesso</p>' +
      '<div class="scheda"><div class="bottoni">' +
        '<button class="principale" onclick="riapriCartella()">Riapri la cartella</button>' +
      '</div></div>';
    aggiornaStatoCartella('In attesa del permesso');
    return;
  }
  disegna();
}

avvia();
