<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a3a1a">
<title>GiardinoApp · Ufficio</title>
<link rel="icon" type="image/png" href="../icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --green-deep: #1a3a1a;
  --green-mid: #2d6a2d;
  --green-light: #4a9e4a;
  --green-pale: #d4edda;
  --green-mist: #eef7ee;
  --earth: #8B6914;
  --earth-light: #f5ecd7;
  --cream: #faf8f3;
  --white: #ffffff;
  --text: #1a1a1a;
  --text-mid: #444;
  --text-light: #888;
  --border: #dde8dd;
  --red: #c0392b;
  --yellow: #e67e22;
  --radius: 14px;
  --radius-sm: 9px;
  --shadow: 0 2px 14px rgba(26,58,26,0.08);
  --font-display: 'Playfair Display', serif;
  --font-body: 'DM Sans', sans-serif;
  --barra-l: 240px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }
body {
  background: var(--cream);
  font-family: var(--font-body);
  color: var(--text);
  font-size: 15px;
}

/* ── IMPIANTO ── */
/* Su PC lo spazio orizzontale c'è: la navigazione sta a sinistra e resta
   sempre visibile, invece di rubare una barra in fondo come sul telefono. */
#app { display: flex; min-height: 100dvh; }

#barra {
  width: var(--barra-l);
  flex-shrink: 0;
  background: var(--green-deep);
  color: var(--white);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100dvh;
}
#barra h1 {
  font-family: var(--font-display);
  font-size: 1.15rem; font-weight: 600;
  padding: 22px 20px 6px;
  letter-spacing: 0.02em;
}
#barra .sotto {
  font-size: 0.72rem; color: rgba(255,255,255,0.55);
  padding: 0 20px 20px; letter-spacing: 0.06em; text-transform: uppercase;
}
.voce-barra {
  background: none; border: none; color: rgba(255,255,255,0.75);
  font-family: var(--font-body); font-size: 0.92rem; text-align: left;
  padding: 12px 20px; cursor: pointer; display: flex; align-items: center; gap: 10px;
  border-left: 3px solid transparent; transition: all 0.15s; width: 100%;
}
.voce-barra:hover { background: rgba(255,255,255,0.07); color: var(--white); }
.voce-barra.attiva { background: rgba(255,255,255,0.12); color: var(--white); border-left-color: var(--green-light); }
.voce-barra .pallino {
  margin-left: auto; background: var(--green-light); color: var(--green-deep);
  font-size: 0.7rem; font-weight: 600; min-width: 21px; height: 21px;
  border-radius: 11px; display: none; align-items: center; justify-content: center; padding: 0 6px;
}
.voce-barra .pallino.visibile { display: flex; }
#stato-cartella {
  margin-top: auto; padding: 16px 20px; font-size: 0.75rem;
  color: rgba(255,255,255,0.55); border-top: 1px solid rgba(255,255,255,0.12);
  word-break: break-word;
}

#contenuto { flex: 1; padding: 28px 34px 60px; max-width: 1100px; }

h2.titolo-pagina {
  font-family: var(--font-display); font-size: 1.6rem; font-weight: 600;
  margin-bottom: 4px;
}
p.sottotitolo { color: var(--text-light); font-size: 0.88rem; margin-bottom: 22px; }

.pagina { display: none; }
.pagina.attiva { display: block; }

/* ── PEZZI ── */
.scheda {
  background: var(--white); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px 20px; margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.scheda.cliccabile { cursor: pointer; transition: all 0.15s; }
.scheda.cliccabile:hover { border-color: var(--green-light); transform: translateY(-1px); }

.riga-scheda { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.nome-cliente { font-family: var(--font-display); font-size: 1.15rem; font-weight: 600; }
.meta { color: var(--text-light); font-size: 0.84rem; }

.etichetta {
  font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
  padding: 3px 9px; border-radius: 20px; white-space: nowrap;
}
.etichetta.nuovo { background: var(--green-pale); color: var(--green-deep); }
.etichetta.corretto { background: #fdebd0; color: #9c5700; }
.etichetta.fatturato { background: var(--green-mist); color: var(--green-mid); }
.etichetta.da-fatturare { background: var(--earth-light); color: var(--earth); }

button.principale, button.secondaria, button.pericolo {
  font-family: var(--font-body); font-size: 0.92rem; font-weight: 500;
  padding: 10px 18px; border-radius: var(--radius-sm); cursor: pointer;
  border: 1px solid transparent; transition: all 0.15s;
}
button.principale { background: var(--green-mid); color: var(--white); }
button.principale:hover { background: var(--green-deep); }
button.secondaria { background: var(--white); color: var(--text-mid); border-color: var(--border); }
button.secondaria:hover { border-color: var(--green-light); color: var(--green-mid); }
button.pericolo { background: var(--white); color: var(--red); border-color: #f2d4d0; }
button.piccola { padding: 6px 12px; font-size: 0.82rem; }
.bottoni { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }

table.elenco { width: 100%; border-collapse: collapse; }
table.elenco th {
  text-align: left; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--text-light); font-weight: 600; padding: 0 8px 8px 0; border-bottom: 1px solid var(--border);
}
table.elenco td { padding: 9px 8px 9px 0; border-bottom: 1px solid var(--border); vertical-align: middle; }
table.elenco tr:last-child td { border-bottom: none; }
table.elenco td.num, table.elenco th.num { text-align: right; padding-right: 0; }
/* Nella scheda cliente le due colonne vanno larghe uguali: lasciate libere, le
   celle si dimensionano sul contenuto e il telefono esce stretto come il numero. */
table.scheda-cliente { table-layout: fixed; }
table.scheda-cliente td { width: 50%; padding-right: 10px; }
table.scheda-cliente td:last-child { padding-right: 0; }

input[type=text], input[type=number], input[type=search], textarea, select {
  font-family: var(--font-body); font-size: 0.92rem; color: var(--text);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 8px 10px; background: var(--white); width: 100%;
}
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--green-light); }
input.prezzo, input.quantita { width: 96px; text-align: right; }
input.vuoto { background: #fffdf5; border-color: #ecdca8; }

.titolo-sezione {
  font-family: var(--font-display); font-size: 1.05rem; font-weight: 600;
  margin: 0 0 10px; padding-top: 4px;
}

.totale { display: flex; justify-content: flex-end; align-items: baseline; gap: 14px; margin-top: 14px; }
.totale .cifra { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; }
.avvertenza {
  background: #fdf6e3; border: 1px solid #ecdca8; color: #8a6d1f;
  border-radius: var(--radius-sm); padding: 10px 13px; font-size: 0.86rem; margin-top: 12px;
}
.allarme {
  background: #fdedec; border: 1px solid #f2d4d0; color: #922b21;
  border-radius: var(--radius-sm); padding: 10px 13px; font-size: 0.86rem; margin-top: 12px;
}
.vuoto-elenco { color: var(--text-light); font-size: 0.9rem; padding: 26px 0; text-align: center; }

#avviso {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(10px);
  background: var(--green-deep); color: var(--white); padding: 12px 22px;
  border-radius: 24px; font-size: 0.9rem; opacity: 0; pointer-events: none;
  transition: all 0.25s; z-index: 100; max-width: 70vw; text-align: center;
}
#avviso.visibile { opacity: 1; transform: translateX(-50%) translateY(0); }
#avviso.brutto { background: var(--red); }

/* ── LA LAVAGNA ── */
/* Non è un calendario: è la lavagna che in ufficio si tiene a matita. A sinistra
   quello che c'è da fare e non ha ancora una data, a destra la settimana spezzata
   in mezze giornate. Niente si muove da solo. */
#pagina-lavagna { max-width: none; }
#contenuto:has(#pagina-lavagna.attiva) { max-width: none; }

.testata-lavagna {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 14px;
}
.testata-lavagna .settimana-num {
  font-family: var(--font-display); font-size: 1.35rem; font-weight: 600;
}
.testata-lavagna .settimana-date { color: var(--text-light); font-size: 0.84rem; }
.freccia-sett {
  width: 34px; height: 34px; border-radius: var(--radius-sm); cursor: pointer;
  border: 1px solid var(--border); background: var(--white); color: var(--text);
  font-size: 1rem; display: grid; place-items: center; font-family: var(--font-body);
}
.freccia-sett:hover { border-color: var(--green-light); color: var(--green-mid); }

.legenda-lavagna {
  display: flex; gap: 18px; flex-wrap: wrap; font-size: 0.78rem; color: var(--text-light);
  margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--border);
}
.legenda-lavagna b { font-weight: 600; color: var(--text); }
.campione { display: inline-block; width: 22px; height: 10px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.campione.matita { border: 1px dashed #8a9280; }
.campione.penna { background: #fbe28c; border: 1px solid #e4c44f; }
.campione.bloccato { background: var(--earth-light); border: 1px solid var(--earth); }

.tavolo { display: flex; gap: 14px; align-items: flex-start; }

.coda { width: 290px; flex-shrink: 0; }
.titolo-colonna {
  font-size: 0.72rem; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--text-light); margin: 0 0 8px;
}
.coda-lista {
  padding: 8px; border-radius: var(--radius); background: var(--white);
  border: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px;
  min-height: 160px;
}
.coda-lista.sopra { border-color: var(--green-light); background: var(--green-mist); }
.rimasti {
  display: flex; align-items: center; gap: 10px; margin-bottom: 8px; padding: 9px 11px;
  border-radius: var(--radius-sm); background: var(--earth-light);
  border: 1px solid var(--earth); color: var(--earth); font-size: 0.8rem;
}
.piu-avanti {
  display: flex; align-items: center; gap: 10px; margin-top: 8px; padding: 8px 11px;
  border-radius: var(--radius-sm); background: var(--white);
  border: 1px dashed var(--border); color: var(--text-light); font-size: 0.78rem;
}

/* Le mezze giornate devono stare in riga fra un giorno e l'altro: con sei colonne
   indipendenti il pomeriggio di martedì finiva più in alto di quello di lunedì, e
   su una lavagna l'occhio cerca la riga. Ogni giorno occupa le quattro righe della
   griglia grande e ci si aggancia con subgrid, così l'altezza la decide la casella
   più piena di tutta la settimana. */
.giorni { flex: 1; min-width: 0; display: grid; gap: 10px;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  grid-template-rows: auto auto auto auto; align-items: start; }
.giorno { display: grid; grid-row: span 4; grid-template-rows: subgrid; gap: 6px; }
.giorno-testa { display: flex; align-items: baseline; gap: 6px; }
.giorno-nome { font-size: 0.82rem; font-weight: 600; }
.giorno-data { font-size: 0.72rem; color: var(--text-light); }
.giorno.oggi .giorno-nome { color: var(--green-mid); }
.giorno.sabato .giorno-nome { color: var(--text-light); font-weight: 500; }
.mezza-etichetta {
  font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--text-light); margin-bottom: 3px; display: flex; justify-content: space-between;
}
.mezza-etichetta b { font-weight: 600; color: var(--text-mid); }
.mezza-corpo {
  padding: 6px; border-radius: var(--radius-sm); background: var(--white);
  border: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px;
  min-height: 86px;
}
.mezza-corpo.sopra { border-color: var(--green-light); background: var(--green-mist); }
.giorno-piede {
  align-self: end; font-size: 0.74rem; color: var(--text-light);
  display: flex; justify-content: space-between; border-top: 1px solid var(--border); padding-top: 5px;
}
.giorno-piede b { font-weight: 600; color: var(--text); }

.cartellino {
  background: var(--cream); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 8px 9px; cursor: grab; display: flex; flex-direction: column; gap: 2px;
}
.cartellino:active { cursor: grabbing; }
/* A matita: previsto, il cliente non lo sa ancora. Il tratteggio è la matita. */
.cartellino.matita { border-style: dashed; border-color: #8a9280; background: transparent; }
.cartellino.matita .cliente-cart { color: var(--text-mid); }
/* A penna: il cliente ha confermato. Evidenziato, come sul foglio in ufficio. */
.cartellino.confermato { border-color: #e4c44f; background: var(--white); }
.cartellino.confermato .cliente-cart {
  background: linear-gradient(transparent 58%, #fbe28c 58%); padding: 0 2px; margin-left: -2px;
}
.cartellino.bloccato { border-left: 3px solid var(--earth); }
.cliente-cart { font-weight: 600; font-size: 0.86rem; }
.luogo-cart { font-size: 0.7rem; color: var(--text-light); }
.cosa-cart { font-size: 0.78rem; color: var(--text-mid); }
.riga-cart { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; margin-top: 2px; }
.ore-cart {
  font-size: 0.72rem; font-weight: 600; color: var(--green-mid);
  background: var(--green-mist); padding: 1px 7px; border-radius: 999px;
}
.quando-cart, .origine-cart { font-size: 0.68rem; color: var(--text-light); }
.requisito-cart {
  font-size: 0.68rem; color: var(--earth); background: var(--earth-light);
  border: 1px solid var(--earth); padding: 0 5px; border-radius: 999px;
}
.rimandato-cart {
  font-size: 0.66rem; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.05em; color: var(--earth);
}
.bottone-cart {
  font-size: 0.68rem; font-weight: 600; font-family: var(--font-body); cursor: pointer;
  border: 1px solid var(--border); background: transparent; color: var(--text-light);
  padding: 1px 8px; border-radius: 999px;
}
.bottone-cart.acceso { border-color: var(--green-light); color: var(--green-mid); background: var(--green-mist); }
.bottone-cart[disabled] { opacity: 0.35; cursor: default; }
.larghezza-cart { display: inline-flex; align-items: center; gap: 4px; }
.mezze-cart { font-size: 0.68rem; color: var(--text-light); min-width: 46px; text-align: center; }
.seguito-cart {
  border: 1px dashed var(--border); border-radius: var(--radius-sm); padding: 5px 8px;
  font-size: 0.72rem; color: var(--text-light);
}
.sconfina-cart { font-size: 0.68rem; color: var(--earth); }
.vuoto-mezza { font-size: 0.72rem; color: var(--text-light); text-align: center; padding: 8px 4px; }

/* ── LA COLONNA GESTIONALE DELL'ARCHIVIO ── */
.elenco-stati { display: flex; flex-direction: column; gap: 6px; }
.voce-stato {
  display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: baseline;
  background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 10px 12px; cursor: pointer; font-family: var(--font-body); text-align: left;
  color: var(--text); transition: all 0.15s; width: 100%;
}
.voce-stato:hover { border-color: var(--green-light); }
.voce-stato.attiva { border-color: var(--green-mid); background: var(--green-mist); }
.stato-nome { font-size: 0.9rem; font-weight: 500; }
.stato-conta { font-size: 0.8rem; color: var(--text-light); }
.stato-somma {
  grid-column: 1 / -1; font-family: var(--font-display); font-size: 1.1rem; font-weight: 700;
}

.gruppo-cliente { margin-bottom: 18px; }
.testa-gruppo {
  display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  padding: 0 4px 6px; border-bottom: 1px solid var(--border); margin-bottom: 10px;
}
.testa-gruppo .dovuto {
  margin-left: auto; font-size: 0.82rem; font-weight: 600; color: var(--earth);
}

/* ── IL FOGLIO DA CONSEGNARE ── */
/* Un blocco a parte, invisibile a schermo, che esiste solo per la stampa. Non si
   stampa la schermata: i campi da compilare uscirebbero come caselle vuote, e la
   barra di navigazione non ha senso su carta. Il PDF non richiede una libreria —
   nel dialogo di stampa "Salva come PDF" è una destinazione. */
#foglio { display: none; }

@media print {
  #app, #avviso { display: none !important; }
  #foglio { display: block; }
  body { background: var(--white); color: #000; font-size: 11pt; }
  @page { margin: 18mm 16mm; }
}

#foglio .intestazione { border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 22px; }
#foglio .azienda { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; }
#foglio .recapiti { font-size: 0.82rem; color: #333; margin-top: 3px; }
#foglio h1 {
  font-family: var(--font-display); font-size: 1.25rem; font-weight: 600;
  margin-bottom: 14px;
}
#foglio .a-chi { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 20px; font-size: 0.95rem; }
#foglio .a-chi .etichetta-campo { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: #555; }
#foglio table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
#foglio th {
  text-align: left; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em;
  border-bottom: 1.5px solid #000; padding: 0 8px 6px 0;
}
#foglio td { padding: 7px 8px 7px 0; border-bottom: 1px solid #ccc; }
#foglio td.num, #foglio th.num { text-align: right; padding-right: 0; }
#foglio .da-definire { color: #555; font-style: italic; }
#foglio .riga-totale td {
  border-bottom: none; border-top: 2px solid #000; padding-top: 12px;
  font-weight: 600; font-size: 1.05rem;
}
#foglio .nota-sotto {
  margin-top: 26px; padding-top: 12px; border-top: 1px solid #ccc;
  font-size: 0.82rem; color: #333; white-space: pre-line;
}
#foglio .incompleto { margin-top: 16px; font-size: 0.85rem; color: #8a6d1f; }

#benvenuto { max-width: 560px; }
#benvenuto .scheda { padding: 26px 28px; }
#benvenuto ol { margin: 12px 0 0 20px; color: var(--text-mid); font-size: 0.9rem; line-height: 1.8; }
</style>
</head>
<body>

<div id="app">
  <nav id="barra">
    <h1>GiardinoApp</h1>
    <div class="sotto">Ufficio</div>
    <button class="voce-barra attiva" id="v-arrivi" onclick="vaiA('arrivi')">
      <span>📥</span> In arrivo <span class="pallino" id="pallino-arrivi">0</span>
    </button>
    <button class="voce-barra" id="v-lavagna" onclick="vaiA('lavagna')">
      <span>📋</span> Lavagna <span class="pallino" id="pallino-lavagna">0</span>
    </button>
    <button class="voce-barra" id="v-clienti" onclick="vaiA('clienti')"><span>👥</span> Clienti</button>
    <button class="voce-barra" id="v-archivio" onclick="vaiA('archivio')"><span>🗂️</span> Archivio</button>
    <button class="voce-barra" id="v-listino" onclick="vaiA('listino')"><span>🏷️</span> Listino</button>
    <button class="voce-barra" id="v-impostazioni" onclick="vaiA('impostazioni')"><span>⚙️</span> Impostazioni</button>
    <div id="stato-cartella">Nessuna cartella collegata</div>
  </nav>

  <main id="contenuto">
    <div class="pagina attiva" id="pagina-arrivi"></div>
    <div class="pagina" id="pagina-lavoro"></div>
    <div class="pagina" id="pagina-lavagna"></div>
    <div class="pagina" id="pagina-clienti"></div>
    <div class="pagina" id="pagina-archivio"></div>
    <div class="pagina" id="pagina-archiviato"></div>
    <div class="pagina" id="pagina-listino"></div>
    <div class="pagina" id="pagina-impostazioni"></div>
  </main>
</div>

<div id="foglio"></div>
<div id="avviso"></div>

<script src="../rapportino.js"></script>
<script>
// ── L'APP DELL'UFFICIO ──
// Non ha un database suo in senso proprio: il suo archivio sono file nella
// stessa cartella di Drive da cui legge i rapportini. È una scelta, non una
// scorciatoia — la cartella è sul PC dell'ufficio, che ha già il suo backup
// automatico, e IndexedDB non ci finirebbe dentro. Tutto quello che conta deve
// stare dove il backup passa.
//
// Chi scrive cosa resta come nel LEGGIMI: il telefono deposita in rapportini/ e
// l'ufficio non tocca quella cartella. Un rapportino risulta "in arrivo" perché
// l'archivio non ne ha ancora una copia a quella revisione, non perché qualcuno
// lo abbia spostato.

const VERSIONE_LAVORO = 1;
const CARTELLA_ARRIVI = 'rapportini';
const CARTELLA_APPUNTAMENTI = 'appuntamenti';
const CARTELLA_ARCHIVIO = 'archivio';
const FILE_LISTINO = 'listino.json';
const FILE_IMPOSTAZIONI = 'impostazioni.json';
const FILE_LAVAGNA = 'lavagna.json';
const VERSIONE_LAVAGNA = 2;
const FILE_CLIENTI = 'clienti.json';
const FILE_ANAGRAFICA = 'anagrafica-dal-telefono.json';

// Una mezza giornata sono otto ore di manodopera: quattro d'orologio in due. Serve
// a sapere quante mezze giornate occupa un lavoro lungo, non a dichiarare piena una
// giornata — quello lo decide chi pianifica.
const ORE_MEZZA = 8;
const NOMI_GIORNI = ['Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'];
const MEZZE = ['mattina', 'pomeriggio'];

// L'intestazione del foglio che va al cliente non sta nel codice: sono i dati di
// un'azienda vera, e inventarli su un documento che esce sarebbe peggio che
// lasciarli vuoti. Si compilano in Impostazioni e vivono nella cartella, accanto
// al listino, così il backup del PC li copre come tutto il resto.
const IMPOSTAZIONI_VUOTE = {
  azienda: '', indirizzo: '', citta: '', piva: '', telefono: '', email: '',
  nota: 'Questo documento non è una fattura.',
};

let CARTELLA = null;
let LISTINO = { tipo: 'listino', versione: 1, voci: [] };
// Il listino si modifica a video e si scrive su file solo col bottone. Finché
// resta da salvare, nessuna rilettura della cartella lo deve sovrascrivere: un
// prezzo appena battuto che sparisce a un Ricontrolla è lavoro perso in silenzio.
let LISTINO_DA_SALVARE = false;
let IMPOSTAZIONI = { ...IMPOSTAZIONI_VUOTE };
let IMPOSTAZIONI_DA_SALVARE = false;
let LAVAGNA = { tipo: 'lavagna', versione: VERSIONE_LAVAGNA, lavori: [], visti: [] };
let CLIENTI = [];
let CLIENTI_DA_SALVARE = false;
let SETTIMANA = null;   // il lunedì della settimana mostrata
let TRASCINATO = null;
let MOSTRA_FUTURI = false;
let ARRIVI = [];
let ILLEGGIBILI = [];
let ARCHIVIO = [];
let LAVORO = null;
let PAGINA = 'arrivi';

// ── LA CARTELLA ──
// Tutto il contatto con l'API del browser sta qui dentro. Il resto dell'app
// lavora su un oggetto "cartella" e non sa da dove arrivi: è il motivo per cui
// si può provare senza aprire una finestra di sistema.

function apiCartelleDisponibile() {
  return typeof window.showDirectoryPicker === 'function';
}

async function scegliCartella() {
  if (!apiCartelleDisponibile()) {
    avvisa('Questo browser non sa aprire cartelle: serve Chrome o Edge su PC', true);
    return;
  }
  let maniglia;
  try {
    maniglia = await window.showDirectoryPicker({ id: 'giardinoapp', mode: 'readwrite' });
  } catch (e) {
    return; // l'utente ha annullato: non è un errore
  }
  await ricordaManiglia(maniglia);
  await usaCartella(maniglia);
}

// Il punto d'ingresso: gli riesce anche una cartella finta, purché sappia fare
// getDirectoryHandle, getFileHandle e values(). I test entrano da qui.
async function usaCartella(maniglia) {
  CARTELLA = maniglia;
  aggiornaStatoCartella('Lettura in corso…');
  try {
    await ricarica();
  } catch (e) {
    CARTELLA = null;
    aggiornaStatoCartella('Cartella non leggibile');
    avvisa('Non riesco a leggere la cartella: ' + e.message, true);
    disegna();
    return;
  }
  aggiornaStatoCartella('📁 ' + (maniglia.name || 'cartella collegata'));
  disegna();
}

async function permessoConcesso(maniglia, chiedi) {
  if (typeof maniglia.queryPermission !== 'function') return true;
  const opzioni = { mode: 'readwrite' };
  if ((await maniglia.queryPermission(opzioni)) === 'granted') return true;
  if (!chiedi || typeof maniglia.requestPermission !== 'function') return false;
  return (await maniglia.requestPermission(opzioni)) === 'granted';
}

// Chrome tiene la maniglia fra una sessione e l'altra, ma il permesso lo
// richiede con un gesto dell'utente: da qui il bottone "Riapri la cartella"
// invece di ripassare dalla scelta della cartella ogni mattina.
async function riapriCartella() {
  const maniglia = await maniglieRicordate();
  if (!maniglia) { await scegliCartella(); return; }
  if (!(await permessoConcesso(maniglia, true))) {
    avvisa('Permesso negato sulla cartella', true);
    return;
  }
  await usaCartella(maniglia);
}

function apriMagazzinoManiglie() {
  return new Promise((risolvi, rifiuta) => {
    const r = indexedDB.open('giardinoapp-ufficio', 1);
    r.onupgradeneeded = () => {
      if (!r.result.objectStoreNames.contains('maniglie')) r.result.createObjectStore('maniglie');
    };
    r.onsuccess = () => risolvi(r.result);
    r.onerror = () => rifiuta(r.error);
  });
}

async function ricordaManiglia(maniglia) {
  try {
    const db = await apriMagazzinoManiglie();
    await new Promise((risolvi, rifiuta) => {
      const t = db.transaction('maniglie', 'readwrite');
      t.objectStore('maniglie').put(maniglia, 'cartella');
      t.oncomplete = risolvi;
      t.onerror = () => rifiuta(t.error);
    });
  } catch (e) {
    // Non poterla ricordare è una scomodità, non una perdita di dati: si
    // rimette la cartella a mano. Ma va detto, non ingoiato.
    avvisa('La cartella non resterà in memoria: la dovrai riscegliere', true);
  }
}

async function maniglieRicordate() {
  try {
    const db = await apriMagazzinoManiglie();
    return await new Promise((risolvi, rifiuta) => {
      const t = db.transaction('maniglie', 'readonly');
      const q = t.objectStore('maniglie').get('cartella');
      q.onsuccess = () => risolvi(q.result || null);
      q.onerror = () => rifiuta(q.error);
    });
  } catch (e) {
    return null;
  }
}

// ── LEGGERE E SCRIVERE FILE ──

async function sottocartella(padre, nome, crea) {
  try {
    return await padre.getDirectoryHandle(nome, { create: !!crea });
  } catch (e) {
    return null;
  }
}

async function elencaFile(cartella) {
  const nomi = [];
  if (!cartella) return nomi;
  for await (const voce of cartella.values()) {
    if (voce.kind === 'file' && voce.name.toLowerCase().endsWith('.json')) nomi.push(voce.name);
  }
  return nomi.sort();
}

async function elencaCartelle(cartella) {
  const nomi = [];
  if (!cartella) return nomi;
  for await (const voce of cartella.values()) {
    if (voce.kind === 'directory') nomi.push(voce.name);
  }
  return nomi.sort();
}

async function leggiTesto(cartella, nome) {
  const maniglia = await cartella.getFileHandle(nome);
  const file = await maniglia.getFile();
  return await file.text();
}

async function scriviTesto(cartella, nome, testo) {
  const maniglia = await cartella.getFileHandle(nome, { create: true });
  const flusso = await maniglia.createWritable();
  await flusso.write(testo);
  await flusso.close();
}

// ── CARICAMENTO ──

async function ricarica() {
  if (!CARTELLA) return;
  // L'elenco dei file illeggibili si azzera qui, una volta, e lo riempiono le
  // due letture che seguono. Azzerarlo dopo cancellerebbe quello che la prima
  // delle due ha trovato — e un file illeggibile che non si vede non esiste.
  ILLEGGIBILI = [];
  IMPOSTAZIONI = await caricaImpostazioni();
  CLIENTI = await caricaClienti();
  LAVAGNA = await caricaLavagna();
  LISTINO = await caricaListino();
  ARCHIVIO = await caricaArchivio();
  ARRIVI = await caricaArrivi();
  await assorbiAppuntamenti();
}

// Le prenotazioni fatte dal cantiere entrano sulla lavagna da sole: chi prenota è
// col cliente davanti, e chiedere all'ufficio di ricopiarle a mano vorrebbe dire
// perderne una ogni tanto. Ognuna si guarda una volta sola — finita in «visti»,
// non ricompare nemmeno se in ufficio l'hanno tolta apposta.
async function assorbiAppuntamenti() {
  const cartella = await sottocartella(CARTELLA, CARTELLA_APPUNTAMENTI, false);
  if (!cartella) return;
  const nuovi = [];
  for (const nome of await elencaFile(cartella)) {
    let doc;
    try {
      doc = leggiAppuntamento(await leggiTesto(cartella, nome));
    } catch (e) {
      ILLEGGIBILI.push({ nome: CARTELLA_APPUNTAMENTI + '/' + nome, motivo: e.message });
      continue;
    }
    if (LAVAGNA.visti.includes(doc.id)) continue;
    LAVAGNA.visti.push(doc.id);
    nuovi.push(sistemaLavoro({
      cliente: doc.cliente.nome || '',
      luogo: doc.cliente.citta || '',
      cosa: doc.cosa,
      ore: doc.ore,
      settimana: doc.settimana || '',
      origine: 'prenotato dal cantiere',
      requisiti: doc.requisiti,
      stato: 'lista',
      da: doc.id,
    }));
  }
  if (!nuovi.length) return;
  LAVAGNA.lavori = LAVAGNA.lavori.concat(nuovi);
  await salvaLavagna();
}

async function caricaListino() {
  if (LISTINO_DA_SALVARE) return LISTINO;
  try {
    const testo = await leggiTesto(CARTELLA, FILE_LISTINO);
    const l = JSON.parse(testo);
    if (!l || l.tipo !== 'listino') throw new Error('non è un listino');
    return { tipo: 'listino', versione: Number(l.versione) || 1, voci: Array.isArray(l.voci) ? l.voci : [] };
  } catch (e) {
    // Nessun listino ancora: si parte vuoto e si scrive al primo salvataggio.
    // Non lo creo qui, o un permesso di sola lettura fallirebbe all'apertura.
    return { tipo: 'listino', versione: 1, voci: [] };
  }
}

async function caricaImpostazioni() {
  // Stessa regola del listino: quello che è stato battuto e non ancora salvato
  // non viene sovrascritto da una rilettura della cartella.
  if (IMPOSTAZIONI_DA_SALVARE) return IMPOSTAZIONI;
  try {
    const i = JSON.parse(await leggiTesto(CARTELLA, FILE_IMPOSTAZIONI));
    if (!i || i.tipo !== 'impostazioni-ufficio') throw new Error('non sono le impostazioni');
    return { ...IMPOSTAZIONI_VUOTE, ...(i.dati || {}) };
  } catch (e) {
    return { ...IMPOSTAZIONI_VUOTE };
  }
}

async function salvaImpostazioni() {
  try {
    await scriviTesto(CARTELLA, FILE_IMPOSTAZIONI, JSON.stringify({
      tipo: 'impostazioni-ufficio', versione: 1,
      aggiornato: new Date().toISOString(), dati: IMPOSTAZIONI,
    }, null, 2));
  } catch (e) {
    avvisa('Non ho potuto salvare le impostazioni: ' + e.message, true);
    return false;
  }
  IMPOSTAZIONI_DA_SALVARE = false;
  disegna();
  avvisa('Impostazioni salvate');
  return true;
}

function modificaImpostazione(campo, valore) {
  IMPOSTAZIONI[campo] = valore;
  IMPOSTAZIONI_DA_SALVARE = true;
  const cartello = document.getElementById('impostazioni-da-salvare');
  if (cartello) cartello.style.display = 'block';
}

// ── L'ANAGRAFICA ──
// L'archivio dell'ufficio, non una copia di quello del telefono. Qui i clienti
// hanno anche telefono e mail — quello che serve per chiamare e confermare un
// appuntamento — e il telefono non li conosce. Per questo l'ufficio importa da
// un file a parte invece di leggere direttamente quello che esporta il cantiere:
// un'importazione che sovrascrive cancellerebbe i numeri di telefono a ogni giro.

async function caricaClienti() {
  if (CLIENTI_DA_SALVARE) return CLIENTI;
  try {
    const a = JSON.parse(await leggiTesto(CARTELLA, FILE_CLIENTI));
    if (!a || a.tipo !== 'anagrafica-ufficio') throw new Error('non è l\'anagrafica');
    return (Array.isArray(a.clienti) ? a.clienti : []).map(sistemaCliente);
  } catch (e) {
    return [];
  }
}

function sistemaCliente(c) {
  return {
    id: c.id || 'c' + Math.random().toString(36).slice(2),
    nome: c.nome || '', indirizzo: c.indirizzo || '', citta: c.citta || '',
    telefono: c.telefono || '', email: c.email || '', note: c.note || '',
  };
}

async function salvaClienti() {
  try {
    await scriviTesto(CARTELLA, FILE_CLIENTI, JSON.stringify({
      tipo: 'anagrafica-ufficio', versione: 1,
      aggiornato: new Date().toISOString(), clienti: CLIENTI,
    }, null, 2));
  } catch (e) {
    avvisa('Non ho potuto salvare l\'anagrafica: ' + e.message, true);
    return false;
  }
  CLIENTI_DA_SALVARE = false;
  disegna();
  avvisa('Anagrafica salvata');
  return true;
}

function modificaCliente(id, campo, valore) {
  const c = CLIENTI.find(x => x.id === id);
  if (!c) return;
  c[campo] = valore;
  CLIENTI_DA_SALVARE = true;
  const cartello = document.getElementById('clienti-da-salvare');
  if (cartello) cartello.style.display = 'block';
}

async function caricaLavagna() {
  try {
    const l = JSON.parse(await leggiTesto(CARTELLA, FILE_LAVAGNA));
    if (!l || l.tipo !== 'lavagna') throw new Error('non è una lavagna');
    // In costruzione non si converte: o è di questa versione, o si riparte.
    if ((Number(l.versione) || 0) !== VERSIONE_LAVAGNA) {
      throw new Error('Lavagna della versione ' + (l.versione || '?') +
        ': questa app legge la ' + VERSIONE_LAVAGNA + ', si riparte da vuota');
    }
    return {
      tipo: 'lavagna', versione: VERSIONE_LAVAGNA,
      lavori: Array.isArray(l.lavori) ? l.lavori.map(sistemaLavoro) : [],
      visti: Array.isArray(l.visti) ? l.visti : [],
    };
  } catch (e) {
    // Nessuna lavagna ancora, o illeggibile: si parte vuota. Se c'era e non si è
    // potuta leggere va detto, o una settimana di pianificazione sparirebbe
    // senza un rumore.
    if (String(e.message || '').includes('versione')) {
      ILLEGGIBILI.push({ nome: FILE_LAVAGNA, motivo: e.message });
    }
    return { tipo: 'lavagna', versione: VERSIONE_LAVAGNA, lavori: [], visti: [] };
  }
}

function sistemaLavoro(l) {
  return {
    id: l.id || 'l' + Math.random().toString(36).slice(2),
    cliente: l.cliente || '', luogo: l.luogo || '', cosa: l.cosa || '',
    ore: Number(l.ore) || 0,
    // La settimana in cui andrebbe fatto, scritta come il lunedì che la apre.
    // Non un giorno preciso: il giorno lo decide chi pianifica trascinandolo,
    // e prometterlo prima vorrebbe dire spostarlo tre volte.
    settimana: l.settimana ? lunediDellaSettimana(l.settimana) : '',
    origine: l.origine || '',
    requisiti: Array.isArray(l.requisiti) ? l.requisiti.filter(r => r) : [],
    rimandato: !!l.rimandato,
    stato: l.stato === 'matita' || l.stato === 'confermato' ? l.stato : 'lista',
    // La posizione è una data vera, non un posto nella griglia: un indice dentro la
    // settimana mostrata farebbe spostare i cartellini da soli cambiando settimana,
    // e niente su questa lavagna si muove da solo.
    giorno: l.giorno || '',
    mezza: l.mezza === 'pomeriggio' ? 'pomeriggio' : (l.mezza === 'mattina' ? 'mattina' : ''),
    // Quante mezze giornate occupa. Si allarga e si stringe a mano, un passo per
    // volta: dedurle dalla stima ore legava la pianificazione a un numero messo
    // a occhio, e chi pianifica sa cose che la stima non sa. I lavori salvati
    // prima portavano un interruttore: si convertono una volta e amen.
    mezze: Math.max(1, Number(l.mezze) || (l.piuGiorni ? Math.ceil((Number(l.ore) || 0) / ORE_MEZZA) : 1)),
    da: l.da || '',
  };
}

// La lavagna si salva a ogni mossa, senza un bottone: una lavagna che ti chiede di
// ricordarti di salvare è una lavagna che perde una settimana di pianificazione.
async function salvaLavagna() {
  try {
    await scriviTesto(CARTELLA, FILE_LAVAGNA, JSON.stringify({
      ...LAVAGNA, aggiornato: new Date().toISOString(),
    }, null, 2));
    return true;
  } catch (e) {
    avvisa('Non ho potuto salvare la lavagna: ' + e.message, true);
    return false;
  }
}

async function caricaArchivio() {
  const radice = await sottocartella(CARTELLA, CARTELLA_ARCHIVIO, false);
  if (!radice) return [];
  const lavori = [];
  const anni = await elencaCartelle(radice);
  for (const anno of anni) {
    const cartellaAnno = await sottocartella(radice, anno, false);
    for (const nome of await elencaFile(cartellaAnno)) {
      try {
        lavori.push({ ...leggiLavoro(await leggiTesto(cartellaAnno, nome)), anno, file: nome });
      } catch (e) {
        // Un file d'archivio illeggibile è grave, ma non deve impedire di vedere
        // gli altri: si segnala e si va avanti.
        ILLEGGIBILI.push({ nome: CARTELLA_ARCHIVIO + '/' + anno + '/' + nome, motivo: e.message });
      }
    }
  }
  return lavori;
}

async function caricaArrivi() {
  const cartella = await sottocartella(CARTELLA, CARTELLA_ARRIVI, false);
  if (!cartella) return [];
  const arrivi = [];
  for (const nome of await elencaFile(cartella)) {
    let doc;
    try {
      doc = leggiRapportino(await leggiTesto(cartella, nome));
    } catch (e) {
      // Drive potrebbe essere a metà sincronizzazione, il file troncato, o non
      // essere un rapportino. Nessuno di questi casi si nasconde: un rapportino
      // che non si riesce a leggere è lavoro fatto che rischia di non essere
      // fatturato, e deve stare a video finché qualcuno lo guarda.
      ILLEGGIBILI.push({ nome: CARTELLA_ARRIVI + '/' + nome, motivo: e.message });
      continue;
    }
    const archiviato = ARCHIVIO.find(l => l.id === doc.id);
    if (archiviato && Number(archiviato.revisione) >= Number(doc.revisione)) continue;
    arrivi.push({ doc, file: nome, corretto: !!archiviato });
  }
  arrivi.sort((a, b) => String(b.doc.data).localeCompare(String(a.doc.data)));
  return arrivi;
}

// Anche l'archivio si rilegge con diffidenza: è lo stesso principio del
// rapportino, e un anno dopo questi file li avrà toccati solo il tempo.
function leggiLavoro(grezzo) {
  let l = grezzo;
  if (typeof grezzo === 'string') {
    try { l = JSON.parse(grezzo); }
    catch (e) { throw new Error('Il file non è leggibile: non è JSON valido'); }
  }
  if (!l || l.tipo !== 'lavoro-archiviato') throw new Error('Questo file non è un lavoro archiviato');
  const versione = Number(l.versione) || 0;
  if (versione > VERSIONE_LAVORO) {
    throw new Error('Lavoro archiviato da una versione più recente (' + versione + '): aggiorna l\'app');
  }
  if (!l.id) throw new Error('Lavoro archiviato senza identificativo');
  return {
    ...l,
    versione: versione || 1,
    revisione: Number(l.revisione) || 1,
    righe: Array.isArray(l.righe) ? l.righe : [],
    rapportino: l.rapportino || null,
    inPosta: l.inPosta || '',
    stato: l.stato === 'fatturato' ? 'fatturato' : 'da-fatturare',
  };
}

// ── IL CONTEGGIO ──
// Le stesse regole del telefono, con una differenza: qui il listino è quello
// vero. Il prezzo che arriva dal cantiere è un suggerimento, e vale solo se in
// listino quella voce non ha un prezzo.

function voceInListino(voceID) {
  return LISTINO.voci.find(v => v.voceID === voceID) || null;
}

function costruisciConteggio(doc, precedenti) {
  const vecchie = Array.isArray(precedenti) ? precedenti : [];
  const righe = (doc.righe || []).map(r => {
    const vecchia = vecchie.find(x => x.chiave && x.chiave === r.chiave);
    const inListino = voceInListino(r.voceID);
    let prezzo = '';
    let manuale = false;
    if (vecchia && vecchia.manuale) {
      // Un prezzo scritto a mano non viene mai risovrascritto dal listino:
      // chi l'ha messo sapeva qualcosa che il listino non sa.
      prezzo = vecchia.prezzo;
      manuale = true;
    } else if (inListino && inListino.prezzo !== '' && inListino.prezzo != null) {
      prezzo = Number(inListino.prezzo);
    }
    return {
      chiave: r.chiave || '',
      voceID: r.voceID || '',
      voce: (inListino && inListino.voce) || r.voce || '',
      quantita: r.quantita == null ? '' : Number(r.quantita),
      unita: (inListino && inListino.unita) || r.unita || '',
      prezzo,
      manuale,
    };
  });
  // Le righe aggiunte in ufficio non hanno chiave e non nascono da niente:
  // restano dove sono, come sul telefono.
  vecchie.filter(r => !r.chiave).forEach(r => righe.push({ ...r }));
  return righe;
}

function importoRiga(r) {
  const q = parseFloat(r.quantita);
  const p = parseFloat(r.prezzo);
  if (isNaN(q) || isNaN(p)) return null;
  return q * p;
}

// Somma solo le righe complete e dice quante ne ha lasciate fuori. Un totale
// che sembra finito mentre gli manca lo smaltimento è peggio di nessun totale.
function totaleConteggio(righe) {
  let totale = 0;
  let escluse = 0;
  (righe || []).forEach(r => {
    const i = importoRiga(r);
    if (i == null) escluse++; else totale += i;
  });
  return { totale: Number(totale.toFixed(2)), escluse };
}

// ── ARCHIVIARE ──

async function archivia() {
  if (!LAVORO) return;
  const doc = LAVORO.doc;
  const conteggio = totaleConteggio(LAVORO.righe);
  const lavoro = {
    tipo: 'lavoro-archiviato',
    versione: VERSIONE_LAVORO,
    id: doc.id,
    revisione: Number(doc.revisione) || 1,
    archiviato: new Date().toISOString(),
    cliente: doc.cliente,
    data: doc.data,
    righe: LAVORO.righe,
    totale: conteggio.totale,
    righeSenzaPrezzo: conteggio.escluse,
    stato: LAVORO.stato || 'da-fatturare',
    // Il rapportino ci viaggia dentro per intero: fra due anni questo file deve
    // raccontare il lavoro da solo, anche se la cartella degli arrivi è stata
    // svuotata e il telefono cambiato.
    rapportino: doc,
  };

  // Se di questo lavoro c'è già una copia in archivio, si riscrive quella. Il
  // nome si ricava da data e cliente, e un cliente rinominato sul telefono
  // produrrebbe un secondo file con lo stesso lavoro dentro.
  const esistente = ARCHIVIO.find(l => l.id === doc.id);
  const anno = esistente ? esistente.anno : (String(doc.data || '').slice(0, 4) || String(new Date().getFullYear()));
  const nome = esistente ? esistente.file : nomeFileRapportino(doc);

  try {
    const radice = await sottocartella(CARTELLA, CARTELLA_ARCHIVIO, true);
    if (!radice) throw new Error('non riesco a creare la cartella archivio');
    const cartellaAnno = await sottocartella(radice, anno, true);
    if (!cartellaAnno) throw new Error('non riesco a creare la cartella ' + anno);
    await scriviTesto(cartellaAnno, nome, JSON.stringify(lavoro, null, 2));
  } catch (e) {
    // Un salvataggio fallito si dice a chiaro schermo. Se restasse in console,
    // l'unica traccia di questo lavoro tornerebbe a essere il file in arrivo.
    avvisa('Non ho potuto archiviare: ' + e.message, true);
    return;
  }

  await ricarica();
  LAVORO = null;
  vaiA('arrivi');
  avvisa('Archiviato: ' + (doc.cliente && doc.cliente.nome ? doc.cliente.nome : 'lavoro') + ' · ' + formattaEuro(conteggio.totale));
}

async function cambiaStato(id, stato) {
  const lavoro = ARCHIVIO.find(l => l.id === id);
  if (!lavoro) return;
  const aggiornato = { ...lavoro, stato };
  delete aggiornato.anno;
  delete aggiornato.file;
  try {
    const radice = await sottocartella(CARTELLA, CARTELLA_ARCHIVIO, true);
    const cartellaAnno = await sottocartella(radice, lavoro.anno, true);
    await scriviTesto(cartellaAnno, lavoro.file, JSON.stringify(aggiornato, null, 2));
  } catch (e) {
    avvisa('Non ho potuto salvare: ' + e.message, true);
    return;
  }
  lavoro.stato = stato;
  disegna();
  avvisa(stato === 'fatturato' ? 'Segnato come fatturato' : 'Rimesso fra i lavori da fatturare');
}

// ── IL LISTINO ──

async function salvaListino() {
  const da_salvare = {
    tipo: 'listino',
    versione: 1,
    aggiornato: new Date().toISOString(),
    voci: LISTINO.voci,
  };
  try {
    await scriviTesto(CARTELLA, FILE_LISTINO, JSON.stringify(da_salvare, null, 2));
  } catch (e) {
    avvisa('Non ho potuto salvare il listino: ' + e.message, true);
    return false;
  }
  LISTINO_DA_SALVARE = false;
  disegna();
  avvisa('Listino salvato');
  return true;
}

function aggiungiVoce() {
  LISTINO.voci.push({ voceID: 'v' + Date.now().toString(36), voce: '', unita: '', prezzo: '', aCorpo: false });
  LISTINO_DA_SALVARE = true;
  disegna();
}

function eliminaVoce(voceID) {
  const v = voceInListino(voceID);
  if (!v) return;
  if (!confirm('Eliminare la voce "' + (v.voce || 'senza nome') + '" dal listino?')) return;
  LISTINO.voci = LISTINO.voci.filter(x => x.voceID !== voceID);
  LISTINO_DA_SALVARE = true;
  disegna();
}

// oninput e non onchange: con onchange il modello resta indietro fino al blur, e
// chi salva senza uscire dal campo salva il valore di prima.
function modificaVoce(voceID, campo, valore) {
  const v = voceInListino(voceID);
  if (!v) return;
  v[campo] = campo === 'prezzo' ? valore.replace(',', '.') : valore;
  LISTINO_DA_SALVARE = true;
  segnalaListinoDaSalvare();
}

function segnaACorpo(voceID, si) {
  const v = voceInListino(voceID);
  if (!v) return;
  v.aCorpo = !!si;
  LISTINO_DA_SALVARE = true;
  segnalaListinoDaSalvare();
}

// Si accende un cartello, non si ridisegna la tabella: chi sta battendo un
// prezzo non deve vedersi sparire il campo da sotto le dita.
function segnalaListinoDaSalvare() {
  const cartello = document.getElementById('listino-da-salvare');
  if (cartello) cartello.style.display = 'block';
}

// ── IL FOGLIO DA CONSEGNARE ──
// Va al cliente, e contiene solo il conto: le ore e le operazioni restano in
// ufficio. I prezzi del listino sono IVA inclusa, quindi il totale lo dice — un
// importo su un foglio che esce senza dire se l'IVA c'è dentro è un'ambiguità
// che qualcuno paga.

function costruisciFoglio({ cliente, data, righe }) {
  const { totale, escluse } = totaleConteggio(righe);
  const sede = [IMPOSTAZIONI.indirizzo, IMPOSTAZIONI.citta].filter(x => x).join(' · ');
  const contatti = [
    IMPOSTAZIONI.piva ? 'P.IVA ' + IMPOSTAZIONI.piva : '',
    IMPOSTAZIONI.telefono,
    IMPOSTAZIONI.email,
  ].filter(x => x).join(' · ');

  let html = '<div class="intestazione">' +
    '<div class="azienda">' + perValore(IMPOSTAZIONI.azienda) + '</div>' +
    (sede ? '<div class="recapiti">' + perValore(sede) + '</div>' : '') +
    (contatti ? '<div class="recapiti">' + perValore(contatti) + '</div>' : '') +
  '</div>';

  html += '<h1>Conto dei lavori</h1>';
  html += '<div class="a-chi">' +
    '<div><div class="etichetta-campo">Cliente</div>' +
      '<strong>' + perValore((cliente && cliente.nome) || '') + '</strong>' +
      ((cliente && cliente.indirizzo) ? '<br>' + perValore(cliente.indirizzo) : '') +
      ((cliente && cliente.citta) ? '<br>' + perValore(cliente.citta) : '') +
    '</div>' +
    '<div style="text-align:right"><div class="etichetta-campo">Data del lavoro</div>' +
      '<strong>' + formattaData(data) + '</strong></div>' +
  '</div>';

  html += '<table><thead><tr><th>Voce</th><th class="num">Quantità</th>' +
    '<th>Unità</th><th class="num">Prezzo</th><th class="num">Importo</th></tr></thead><tbody>';
  (righe || []).forEach(r => {
    const imp = importoRiga(r);
    html += '<tr>' +
      '<td>' + perValore(r.voce) + '</td>' +
      '<td class="num">' + perValore(formattaQuantita(r.quantita)) + '</td>' +
      '<td>' + perValore(r.unita) + '</td>' +
      '<td class="num">' + (r.prezzo === '' || r.prezzo == null ? '' : formattaEuro(r.prezzo)) + '</td>' +
      // Una riga senza prezzo non stampa uno spazio bianco: dice che l'importo
      // si valuta, come fa il testo della mail sul telefono.
      '<td class="num">' + (imp == null ? '<span class="da-definire">da definire</span>' : formattaEuro(imp)) + '</td>' +
    '</tr>';
  });
  html += '<tr class="riga-totale"><td colspan="4">Totale (IVA inclusa)</td>' +
    '<td class="num">' + formattaEuro(totale) + '</td></tr>';
  html += '</tbody></table>';

  if (escluse) {
    html += '<div class="incompleto">' + escluse +
      (escluse === 1 ? ' voce resta da valutare e non è compresa' : ' voci restano da valutare e non sono comprese') +
      ' nel totale qui sopra.</div>';
  }
  if (IMPOSTAZIONI.nota) {
    html += '<div class="nota-sotto">' + perValore(IMPOSTAZIONI.nota) + '</div>';
  }
  return html;
}

function stampaConto(origine, id) {
  let cliente, data, righe;
  if (origine === 'lavoro') {
    if (!LAVORO) return;
    cliente = LAVORO.doc.cliente; data = LAVORO.doc.data; righe = LAVORO.righe;
  } else {
    const l = ARCHIVIO.find(x => x.id === id);
    if (!l) { avvisa('Lavoro non trovato: ricontrolla la cartella', true); return; }
    cliente = l.cliente || {}; data = l.data; righe = l.righe;
  }

  // Un foglio che va a un cliente senza dire da chi arriva non serve a niente:
  // si avvisa, ma la decisione resta di chi stampa.
  if (!String(IMPOSTAZIONI.azienda || '').trim()) {
    if (!confirm('Manca l\'intestazione con i dati dell\'azienda: si compila in Impostazioni.\n\nStampare comunque?')) return;
  }

  document.getElementById('foglio').innerHTML = costruisciFoglio({ cliente, data, righe });

  // Chrome propone il titolo della pagina come nome del file quando si salva in
  // PDF, e lo legge a stampa avviata: rimetterlo a posto subito darebbe un PDF
  // chiamato "GiardinoApp · Ufficio". Si aspetta afterprint.
  const titolo = document.title;
  const ripristina = () => {
    document.title = titolo;
    window.removeEventListener('afterprint', ripristina);
  };
  window.addEventListener('afterprint', ripristina);
  document.title = 'Conto ' + (String(data || '').slice(0, 10) || 'senza-data') +
    ' ' + ((cliente && cliente.nome) || 'cliente');
  window.print();
}

// ── FORMATI ──

function formattaEuro(n) {
  const v = parseFloat(n);
  return isNaN(v) ? '' : v.toFixed(2).replace('.', ',') + ' €';
}

function formattaQuantita(v) {
  const n = parseFloat(v);
  return isNaN(n) ? '' : String(n).replace('.', ',');
}

function formattaOre(n) {
  return (Number(n) || 0).toFixed(2).replace('.', ',') + ' h';
}

function formattaData(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || ''));
  return m ? m[3] + '/' + m[2] + '/' + m[1] : (iso || '');
}

function perValore(v) {
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/"/g, '&quot;')
    .replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Gli id finiscono dentro stringhe JavaScript dentro attributi HTML: senza
// questo, un cognome come "Dall'Oglio" rende il bottone inerte.
function perOnclick(v) {
  return String(v == null ? '' : v)
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'")
    .replace(/"/g, '&quot;')
    .replace(/</g, '&lt;');
}

function avvisa(messaggio, brutto) {
  const a = document.getElementById('avviso');
  a.textContent = messaggio;
  a.classList.toggle('brutto', !!brutto);
  a.classList.add('visibile');
  clearTimeout(avvisa._t);
  // Un errore resta a video più a lungo: va letto, non intravisto.
  avvisa._t = setTimeout(() => a.classList.remove('visibile'), brutto ? 6000 : 2800);
}

function aggiornaStatoCartella(testo) {
  document.getElementById('stato-cartella').textContent = testo;
}

// ── NAVIGAZIONE ──

function vaiA(pagina) {
  PAGINA = pagina;
  document.querySelectorAll('.pagina').forEach(p => p.classList.remove('attiva'));
  const p = document.getElementById('pagina-' + pagina);
  if (p) p.classList.add('attiva');
  document.querySelectorAll('.voce-barra').forEach(v => v.classList.remove('attiva'));
  // La schermata di un lavoro vive dentro "In arrivo": è da lì che ci si arriva.
  const dentro = { lavoro: 'arrivi', archiviato: 'archivio' };
  const voce = document.getElementById('v-' + (dentro[pagina] || pagina));
  if (voce) voce.classList.add('attiva');
  disegna();
}

function disegna() {
  const pallino = document.getElementById('pallino-arrivi');
  pallino.textContent = ARRIVI.length;
  pallino.classList.toggle('visibile', ARRIVI.length > 0);
  // Il pallino conta quello che si può pianificare adesso, non tutto quello che
  // c'è in archivio: un numero che comprende marzo prossimo non dice niente.
  const daPianificare = daPianificareOra().length;
  const pallinoL = document.getElementById('pallino-lavagna');
  pallinoL.textContent = daPianificare;
  pallinoL.classList.toggle('visibile', daPianificare > 0);
  if (PAGINA === 'arrivi') disegnaArrivi();
  if (PAGINA === 'lavoro') disegnaLavoro();
  if (PAGINA === 'lavagna') disegnaLavagna();
  if (PAGINA === 'clienti') disegnaClienti();
  if (PAGINA === 'archivio') disegnaArchivio();
  if (PAGINA === 'archiviato') disegnaArchiviato();
  if (PAGINA === 'listino') disegnaListino();
  if (PAGINA === 'impostazioni') disegnaImpostazioni();
}

// ── IN ARRIVO ──

function disegnaArrivi() {
  const c = document.getElementById('pagina-arrivi');
  if (!CARTELLA) { c.innerHTML = schermataBenvenuto(); return; }

  let html = '<h2 class="titolo-pagina">In arrivo</h2>';
  html += '<p class="sottotitolo">Rapportini depositati dal telefono e non ancora archiviati</p>';

  if (ILLEGGIBILI.length) {
    html += '<div class="allarme"><strong>' + ILLEGGIBILI.length + ' file non leggibili.</strong><br>' +
      ILLEGGIBILI.map(f => perValore(f.nome) + ' — ' + perValore(f.motivo)).join('<br>') +
      '<br><br>Se Drive era a metà sincronizzazione, riprova fra un minuto con Ricontrolla.</div>';
  }

  if (!ARRIVI.length) {
    html += '<div class="scheda"><div class="vuoto-elenco">Nessun rapportino da lavorare.</div></div>';
  } else {
    ARRIVI.forEach(a => {
      const d = a.doc;
      const conteggio = totaleConteggio(costruisciConteggio(d, null));
      html += '<div class="scheda cliccabile" onclick="apriLavoro(\'' + perOnclick(d.id) + '\')">' +
        '<div class="riga-scheda">' +
          '<span class="nome-cliente">' + perValore(d.cliente.nome || 'senza nome') + '</span>' +
          (a.corretto ? '<span class="etichetta corretto">corretto · rev ' + d.revisione + '</span>'
                      : '<span class="etichetta nuovo">nuovo</span>') +
          '<span class="meta" style="margin-left:auto">' + formattaData(d.data) + '</span>' +
        '</div>' +
        '<div class="meta" style="margin-top:6px">' +
          formattaOre(d.ore.totale) + ' · ' + d.operazioni.length + ' operazioni' +
          (conteggio.totale ? ' · circa ' + formattaEuro(conteggio.totale) : '') +
          (conteggio.escluse ? ' · ' + conteggio.escluse + ' righe senza prezzo' : '') +
        '</div>' +
      '</div>';
    });
  }

  html += '<div class="bottoni"><button class="secondaria" onclick="ricontrolla()">Ricontrolla la cartella</button></div>';
  c.innerHTML = html;
}

function schermataBenvenuto() {
  return '<div id="benvenuto">' +
    '<h2 class="titolo-pagina">Collega la cartella</h2>' +
    '<p class="sottotitolo">Serve una volta sola su questo PC</p>' +
    '<div class="scheda">' +
      '<p>Scegli la cartella <strong>GiardinoApp</strong> dentro Google Drive: da lì l’app legge i rapportini che arrivano dal telefono e ci scrive il suo archivio.</p>' +
      '<ol>' +
        '<li>Google Drive per desktop installato e collegato all’account dei giardini</li>' +
        '<li>La cartella <code>GiardinoApp</code> compare fra le cartelle del PC</li>' +
        '<li>Scegli quella — non <code>rapportini</code>, quella che la contiene</li>' +
      '</ol>' +
      '<div class="bottoni">' +
        '<button class="principale" onclick="riapriCartella()">Scegli la cartella</button>' +
      '</div>' +
      (apiCartelleDisponibile() ? '' :
        '<div class="allarme">Questo browser non sa aprire cartelle. Serve Chrome o Edge su PC.</div>') +
    '</div>' +
  '</div>';
}

async function ricontrolla() {
  if (!CARTELLA) return;
  try {
    await ricarica();
  } catch (e) {
    avvisa('Non riesco a rileggere la cartella: ' + e.message, true);
    return;
  }
  disegna();
  avvisa(ARRIVI.length ? ARRIVI.length + ' da lavorare' : 'Niente di nuovo');
}

// ── UN LAVORO ──

function apriLavoro(id) {
  const arrivo = ARRIVI.find(a => a.doc.id === id);
  if (!arrivo) { avvisa('Rapportino non trovato: ricontrolla la cartella', true); return; }
  // Se è la correzione di un lavoro già archiviato, i prezzi messi a mano la
  // prima volta restano: il cantiere ha corretto le ore, non il listino.
  const precedente = ARCHIVIO.find(l => l.id === id);
  LAVORO = {
    doc: arrivo.doc,
    righe: costruisciConteggio(arrivo.doc, precedente ? precedente.righe : null),
    stato: precedente ? precedente.stato : 'da-fatturare',
    corretto: arrivo.corretto,
  };
  vaiA('lavoro');
}

function disegnaLavoro() {
  const c = document.getElementById('pagina-lavoro');
  if (!LAVORO) { c.innerHTML = '<div class="vuoto-elenco">Nessun lavoro aperto.</div>'; return; }
  const d = LAVORO.doc;

  // L'ordine è quello del rapportino di fine lavoro: cliente, ore, operazioni,
  // note, e il conto in fondo. È lo stesso ordine della schermata sul telefono,
  // e chi legge in ufficio ha davanti la stessa sequenza di chi l'ha scritto.
  let html = '<h2 class="titolo-pagina">' + perValore(d.cliente.nome || 'senza nome') + '</h2>';
  html += '<p class="sottotitolo">' + formattaData(d.data) +
    (d.cliente.indirizzo ? ' · ' + perValore(d.cliente.indirizzo) : '') +
    (d.cliente.citta ? ', ' + perValore(d.cliente.citta) : '') +
    (LAVORO.corretto ? ' · <strong>versione corretta (rev ' + d.revisione + ')</strong>' : '') +
    '</p>';

  html += '<div class="scheda"><div class="titolo-sezione">Ore</div>';
  if (d.ore.fasce && d.ore.fasce.length) {
    html += '<table class="elenco"><tbody>';
    d.ore.fasce.forEach(f => {
      html += '<tr><td>' + perValore(f.inizio) + ' – ' + perValore(f.fine) + '</td>' +
        '<td>' + f.persone + (f.persone === 1 ? ' persona' : ' persone') + '</td>' +
        '<td class="num">' + formattaOre(f.ore) + '</td></tr>';
    });
    html += '</tbody></table>';
  }
  html += '<div class="totale"><span class="meta">Totale ore</span><span class="cifra">' +
    formattaOre(d.ore.totale) + '</span></div></div>';

  html += '<div class="scheda"><div class="titolo-sezione">Operazioni</div>';
  if (!d.operazioni.length) {
    html += '<div class="vuoto-elenco">Nessuna operazione registrata.</div>';
  } else {
    html += '<table class="elenco"><tbody>';
    d.operazioni.forEach(o => {
      const dettagli = [];
      if (o.prodotto) dettagli.push(perValore(o.prodotto));
      if (o.quantita != null) dettagli.push(formattaQuantita(o.quantita) + ' ' + perValore(o.unita));
      if (o.prato) dettagli.push('prato');
      if (o.siepe) dettagli.push('siepe');
      html += '<tr><td><strong>' + perValore(o.nome) + '</strong>' +
        (o.descrizione ? '<br><span class="meta">' + perValore(o.descrizione) + '</span>' : '') +
        '</td><td class="meta">' + dettagli.join(' · ') + '</td></tr>';
    });
    html += '</tbody></table>';
  }
  html += '</div>';

  if (d.note) {
    html += '<div class="scheda"><div class="titolo-sezione">Note dal cantiere</div><p>' +
      perValore(d.note) + '</p></div>';
  }
  if (d.prossimo && d.prossimo.cosa) {
    html += '<div class="scheda"><div class="titolo-sezione">Prossimo intervento</div><p>' +
      perValore(d.prossimo.cosa) +
      (d.prossimo.mese ? ' <span class="meta">— ' + perValore(nomeMese(d.prossimo.mese)) + ' ' + perValore(d.prossimo.anno) + '</span>' : '') +
      '</p></div>';
  }

  html += '<div class="scheda"><div class="titolo-sezione">Conto</div>';
  html += '<table class="elenco"><thead><tr><th>Voce</th><th class="num">Quantità</th>' +
    '<th>Unità</th><th class="num">Prezzo</th><th class="num">Importo</th><th></th></tr></thead><tbody>';
  LAVORO.righe.forEach((r, i) => {
    const imp = importoRiga(r);
    html += '<tr>' +
      '<td>' + (r.chiave ? perValore(r.voce) :
        '<input type="text" value="' + perValore(r.voce) + '" oninput="modificaRiga(' + i + ', \'voce\', this.value)">') + '</td>' +
      '<td class="num"><input type="text" class="quantita" value="' + perValore(formattaQuantita(r.quantita)) +
        '" oninput="modificaRiga(' + i + ', \'quantita\', this.value)"></td>' +
      '<td class="meta">' + perValore(r.unita) + '</td>' +
      '<td class="num"><input type="text" class="prezzo' + (r.prezzo === '' ? ' vuoto' : '') +
        '" value="' + perValore(formattaQuantita(r.prezzo)) +
        '" oninput="modificaRiga(' + i + ', \'prezzo\', this.value)"></td>' +
      '<td class="num" id="importo-' + i + '">' + (imp == null ? '—' : formattaEuro(imp)) + '</td>' +
      '<td class="num">' + (r.chiave ? '' :
        '<button class="secondaria piccola" onclick="togliRiga(' + i + ')">✕</button>') + '</td>' +
    '</tr>';
  });
  html += '</tbody></table>';
  html += '<div class="bottoni"><button class="secondaria piccola" onclick="aggiungiRiga()">+ Aggiungi una riga</button></div>';
  html += '<div id="riepilogo">' + riepilogoConto() + '</div>';
  html += '</div>';

  html += '<div class="bottoni">' +
    '<button class="principale" onclick="archivia()">' +
      (LAVORO.corretto ? 'Aggiorna in archivio' : 'Archivia') + '</button>' +
    '<button class="secondaria" onclick="stampaConto(\'lavoro\')">Stampa il conto</button>' +
    '<button class="secondaria" onclick="tornaAgliArrivi()">Torna in arrivo</button>' +
  '</div>';

  c.innerHTML = html;
}

function riepilogoConto() {
  const { totale, escluse } = totaleConteggio(LAVORO.righe);
  let html = '<div class="totale"><span class="meta">Totale</span><span class="cifra">' +
    formattaEuro(totale) + '</span></div>';
  if (escluse) {
    html += '<div class="avvertenza">' + escluse +
      (escluse === 1 ? ' riga è fuori dal totale' : ' righe sono fuori dal totale') +
      ': manca la quantità o il prezzo. Il totale qui sopra è incompleto.</div>';
  }
  return html;
}

// Non si ridisegna la tabella mentre si scrive: si aggiornano solo l'importo
// della riga e il riepilogo, o il campo sparisce da sotto le dita.
function modificaRiga(indice, campo, valore) {
  const r = LAVORO && LAVORO.righe[indice];
  if (!r) return;
  if (campo === 'quantita' || campo === 'prezzo') {
    r[campo] = valore.trim() === '' ? '' : valore.replace(',', '.');
    // Da qui in poi quel prezzo è dell'ufficio, e il listino non lo tocca più.
    if (campo === 'prezzo') r.manuale = true;
  } else {
    r[campo] = valore;
  }
  const imp = importoRiga(r);
  const cella = document.getElementById('importo-' + indice);
  if (cella) cella.textContent = imp == null ? '—' : formattaEuro(imp);
  const riepilogo = document.getElementById('riepilogo');
  if (riepilogo) riepilogo.innerHTML = riepilogoConto();
}

function aggiungiRiga() {
  if (!LAVORO) return;
  LAVORO.righe.push({ chiave: '', voceID: '', voce: '', quantita: '', unita: '', prezzo: '', manuale: true });
  disegnaLavoro();
}

function togliRiga(indice) {
  if (!LAVORO) return;
  LAVORO.righe.splice(indice, 1);
  disegnaLavoro();
}

function tornaAgliArrivi() {
  LAVORO = null;
  vaiA('arrivi');
}

// ── ARCHIVIO ──

let FILTRO_ARCHIVIO = '';
let STATO_ARCHIVIO = 'tutti';
let RACCOLTA_ARCHIVIO = 'data';
let ARCHIVIATO = null;

function disegnaArchivio() {
  const c = document.getElementById('pagina-archivio');
  if (!CARTELLA) { c.innerHTML = schermataBenvenuto(); return; }

  let html = '<h2 class="titolo-pagina">Archivio</h2>';
  html += '<p class="sottotitolo">' + ARCHIVIO.length +
    (ARCHIVIO.length === 1 ? ' lavoro archiviato' : ' lavori archiviati') + '</p>';

  html += '<div class="tavolo">';

  // ── a sinistra il gestionale: cosa è ancora da incassare ──
  // Sta lì e resta lì mentre si scorre l'elenco: è la domanda che in ufficio ci
  // si fa per prima, e un numero in fondo alla pagina non risponde a nessuno.
  const conti = {
    'da-fatturare': ARCHIVIO.filter(l => l.stato === 'da-fatturare'),
    fatturato: ARCHIVIO.filter(l => l.stato === 'fatturato'),
    tutti: ARCHIVIO,
  };
  const somma = elenco => elenco.reduce((s, l) => s + (Number(l.totale) || 0), 0);
  const voce = (chiave, etichetta) => {
    const elenco = conti[chiave];
    return '<button class="voce-stato' + (STATO_ARCHIVIO === chiave ? ' attiva' : '') +
      '" onclick="filtraStato(\'' + chiave + '\')">' +
      '<span class="stato-nome">' + etichetta + '</span>' +
      '<span class="stato-conta">' + elenco.length + '</span>' +
      '<span class="stato-somma">' + (formattaEuro(somma(elenco)) || '—') + '</span>' +
    '</button>';
  };

  html += '<section class="coda"><h3 class="titolo-colonna">Gestionale</h3>' +
    '<div class="elenco-stati">' +
      voce('da-fatturare', 'Da fatturare') +
      voce('fatturato', 'Fatturato') +
      voce('tutti', 'Tutto') +
    '</div>' +
    '<h3 class="titolo-colonna" style="margin-top:18px">Raccogli</h3>' +
    '<div class="elenco-stati">' +
      '<button class="voce-stato' + (RACCOLTA_ARCHIVIO === 'data' ? ' attiva' : '') +
        '" onclick="cambiaRaccolta(\'data\')"><span class="stato-nome">Per data</span></button>' +
      '<button class="voce-stato' + (RACCOLTA_ARCHIVIO === 'cliente' ? ' attiva' : '') +
        '" onclick="cambiaRaccolta(\'cliente\')"><span class="stato-nome">Per cliente</span></button>' +
    '</div>' +
    '<div style="margin-top:14px"><input type="search" placeholder="Cerca un cliente" value="' +
      perValore(FILTRO_ARCHIVIO) + '" oninput="filtraArchivio(this.value)"></div>' +
  '</section>';

  html += '<section style="flex:1; min-width:0" id="elenco-archivio">' + righeArchivio() + '</section>';
  html += '</div>';
  c.innerHTML = html;
}

function lavoriArchivio() {
  const filtro = FILTRO_ARCHIVIO.trim().toLowerCase();
  return ARCHIVIO
    .filter(l => STATO_ARCHIVIO === 'tutti' || l.stato === STATO_ARCHIVIO)
    .filter(l => !filtro || String((l.cliente && l.cliente.nome) || '').toLowerCase().includes(filtro))
    .sort((a, b) => String(b.data).localeCompare(String(a.data)));
}

function righeArchivio() {
  const lavori = lavoriArchivio();
  if (!lavori.length) {
    return '<div class="scheda"><div class="vuoto-elenco">' +
      (FILTRO_ARCHIVIO.trim() || STATO_ARCHIVIO !== 'tutti'
        ? 'Nessun lavoro con questi filtri.' : 'Niente in archivio.') + '</div></div>';
  }
  if (RACCOLTA_ARCHIVIO !== 'cliente') return lavori.map(schedaArchivio).join('');

  // Raccolti per cliente: quanti lavori ha e quanto di suo è ancora da
  // incassare. È la riga che serve prima di alzare il telefono.
  const perCliente = new Map();
  lavori.forEach(l => {
    const nome = (l.cliente && l.cliente.nome) || 'senza nome';
    if (!perCliente.has(nome)) perCliente.set(nome, []);
    perCliente.get(nome).push(l);
  });
  return [...perCliente.entries()]
    .sort((a, b) => a[0].localeCompare(b[0]))
    .map(([nome, suoi]) => {
      const aperti = suoi.filter(l => l.stato === 'da-fatturare');
      const dovuto = aperti.reduce((s, l) => s + (Number(l.totale) || 0), 0);
      return '<div class="gruppo-cliente">' +
        '<div class="testa-gruppo">' +
          '<span class="nome-cliente">' + perValore(nome) + '</span>' +
          '<span class="meta">' + suoi.length + (suoi.length === 1 ? ' lavoro' : ' lavori') + '</span>' +
          (aperti.length ? '<span class="dovuto">da incassare ' + formattaEuro(dovuto) + '</span>' : '') +
        '</div>' +
        suoi.map(schedaArchivio).join('') +
      '</div>';
    }).join('');
}

function schedaArchivio(l) {
  const id = perOnclick(l.id);
  const nome = (l.cliente && l.cliente.nome) || 'senza nome';
  return '<div class="scheda cliccabile" onclick="apriArchiviato(\'' + id + '\')">' +
    '<div class="riga-scheda">' +
      '<span class="nome-cliente">' + perValore(nome) + '</span>' +
      '<span class="etichetta ' + (l.stato === 'fatturato' ? 'fatturato">fatturato' : 'da-fatturare">da fatturare') + '</span>' +
      (l.inPosta ? '<span class="meta">✉️ in posta</span>' : '') +
      '<span class="meta">' + formattaData(l.data) + '</span>' +
      '<span style="margin-left:auto;font-family:var(--font-display);font-size:1.15rem;font-weight:700">' +
        formattaEuro(l.totale) + '</span>' +
    '</div>' +
    (l.righeSenzaPrezzo ? '<div class="meta" style="margin-top:6px;color:var(--yellow)">' +
      l.righeSenzaPrezzo + (l.righeSenzaPrezzo === 1 ? ' riga fuori dal totale' : ' righe fuori dal totale') +
      '</div>' : '') +
  '</div>';
}

// Il campo di ricerca non passa da disegnaArchivio: ridisegnare tutto a ogni
// tasto gli farebbe perdere il fuoco a metà parola.
function filtraArchivio(valore) {
  FILTRO_ARCHIVIO = valore;
  const el = document.getElementById('elenco-archivio');
  if (el) el.innerHTML = righeArchivio();
}

function filtraStato(stato) {
  STATO_ARCHIVIO = stato;
  disegnaArchivio();
}

function cambiaRaccolta(come) {
  RACCOLTA_ARCHIVIO = come;
  disegnaArchivio();
}

// ── UN LAVORO ARCHIVIATO ──
// Si guarda, si stampa, si manda. Non si corregge: per cambiare un lavoro chiuso
// si rimanda il rapportino corretto dal cantiere, e torna fra quelli in arrivo.

function apriArchiviato(id) {
  const l = ARCHIVIO.find(x => x.id === id);
  if (!l) { avvisa('Lavoro non trovato: ricontrolla la cartella', true); return; }
  ARCHIVIATO = id;
  vaiA('archiviato');
}

function disegnaArchiviato() {
  const c = document.getElementById('pagina-archiviato');
  const l = ARCHIVIO.find(x => x.id === ARCHIVIATO);
  if (!l) { c.innerHTML = '<div class="vuoto-elenco">Nessun lavoro aperto.</div>'; return; }
  const r = l.rapportino;
  const id = perOnclick(l.id);
  const conteggio = totaleConteggio(l.righe);

  let html = '<h2 class="titolo-pagina">' + perValore((l.cliente && l.cliente.nome) || 'senza nome') + '</h2>';
  html += '<p class="sottotitolo">' + formattaData(l.data) +
    ' · ' + (l.stato === 'fatturato' ? 'fatturato' : 'da fatturare') +
    (l.inPosta ? ' · mandato al cliente il ' + formattaData(l.inPosta) : '') + '</p>';

  html += '<div class="scheda"><div class="titolo-sezione">Conto</div>';
  html += '<table class="elenco"><thead><tr><th>Voce</th><th class="num">Quantità</th>' +
    '<th>Unità</th><th class="num">Prezzo</th><th class="num">Importo</th></tr></thead><tbody>';
  l.righe.forEach(riga => {
    const imp = importoRiga(riga);
    html += '<tr><td>' + perValore(riga.voce) + '</td>' +
      '<td class="num">' + perValore(formattaQuantita(riga.quantita)) + '</td>' +
      '<td class="meta">' + perValore(riga.unita) + '</td>' +
      '<td class="num">' + (riga.prezzo === '' || riga.prezzo == null ? '' : formattaEuro(riga.prezzo)) + '</td>' +
      '<td class="num">' + (imp == null ? '—' : formattaEuro(imp)) + '</td></tr>';
  });
  html += '</tbody></table>';
  html += '<div class="totale"><span class="meta">Totale (IVA inclusa)</span>' +
    '<span class="cifra">' + formattaEuro(conteggio.totale) + '</span></div>';
  if (conteggio.escluse) {
    html += '<div class="avvertenza">' + conteggio.escluse +
      (conteggio.escluse === 1 ? ' riga è fuori dal totale' : ' righe sono fuori dal totale') + '.</div>';
  }
  html += '</div>';

  // Ore e operazioni non vanno sul foglio del cliente, ma qui servono: sono il
  // perché di quel totale, ed è la domanda che arriva quando qualcuno telefona.
  if (r) {
    html += '<div class="scheda"><div class="titolo-sezione">Ore</div>';
    if (r.ore && r.ore.fasce && r.ore.fasce.length) {
      html += '<table class="elenco"><tbody>';
      r.ore.fasce.forEach(f => {
        html += '<tr><td>' + perValore(f.inizio) + ' – ' + perValore(f.fine) + '</td>' +
          '<td>' + f.persone + (f.persone === 1 ? ' persona' : ' persone') + '</td>' +
          '<td class="num">' + formattaOre(f.ore) + '</td></tr>';
      });
      html += '</tbody></table>';
    }
    html += '<div class="totale"><span class="meta">Totale ore</span><span class="cifra">' +
      formattaOre(r.ore ? r.ore.totale : 0) + '</span></div></div>';

    if (r.operazioni && r.operazioni.length) {
      html += '<div class="scheda"><div class="titolo-sezione">Operazioni</div><table class="elenco"><tbody>';
      r.operazioni.forEach(o => {
        const dettagli = [];
        if (o.prodotto) dettagli.push(perValore(o.prodotto));
        if (o.quantita != null) dettagli.push(formattaQuantita(o.quantita) + ' ' + perValore(o.unita));
        html += '<tr><td><strong>' + perValore(o.nome) + '</strong>' +
          (o.descrizione ? '<br><span class="meta">' + perValore(o.descrizione) + '</span>' : '') +
          '</td><td class="meta">' + dettagli.join(' · ') + '</td></tr>';
      });
      html += '</tbody></table></div>';
    }
    if (r.note) {
      html += '<div class="scheda"><div class="titolo-sezione">Note dal cantiere</div><p>' +
        perValore(r.note) + '</p></div>';
    }
  }

  html += '<div class="bottoni">' +
    '<button class="secondaria" onclick="stampaConto(\'archivio\', \'' + id + '\')">Stampa</button>' +
    '<button class="secondaria" onclick="inviaConto(\'' + id + '\')">Invia al cliente</button>' +
    '<button class="' + (l.stato === 'fatturato' ? 'secondaria' : 'principale') +
      '" onclick="cambiaStato(\'' + id + '\', \'' +
      (l.stato === 'fatturato' ? 'da-fatturare\')">Rimetti da fatturare' : 'fatturato\')">Segna fatturato') +
      '</button>' +
    '<button class="secondaria" onclick="vaiA(\'archivio\')">Torna all\'archivio</button>' +
  '</div>';

  c.innerHTML = html;
}

// Niente colonne allineate con gli spazi: le app di posta usano caratteri a
// larghezza variabile e arrivano storte. Una voce per riga.
function testoConto(l) {
  const { totale, escluse } = totaleConteggio(l.righe);
  const righe = [];
  righe.push('CONTO DEI LAVORI');
  righe.push((l.cliente && l.cliente.nome) || '');
  if (l.data) righe.push(formattaData(l.data));
  righe.push('');
  l.righe.forEach(r => {
    const imp = importoRiga(r);
    const quantita = formattaQuantita(r.quantita);
    const misurabile = quantita && (r.unita || parseFloat(r.quantita) !== 1);
    const conUnita = misurabile ? quantita + (r.unita ? ' ' + r.unita : '') : '';
    if (imp == null) {
      // Dire cosa manca è più utile che tacere: chi legge sa cosa resta da
      // quantificare e non deve telefonare per chiederlo.
      righe.push('  ' + r.voce + ' — ' + [conUnita, 'importo da definire'].filter(Boolean).join(', '));
    } else {
      righe.push('  ' + r.voce + ' — ' +
        (conUnita ? conUnita + ' × ' + formattaEuro(r.prezzo) + ' = ' : '') + formattaEuro(imp));
    }
  });
  righe.push('');
  righe.push('  TOTALE (IVA inclusa): ' + formattaEuro(totale));
  if (escluse) {
    righe.push('  (' + escluse + (escluse === 1 ? ' voce resta' : ' voci restano') +
      ' da valutare e non ' + (escluse === 1 ? 'è compresa' : 'sono comprese') + ' nel totale)');
  }
  if (IMPOSTAZIONI.nota) righe.push('', IMPOSTAZIONI.nota);
  if (IMPOSTAZIONI.azienda) righe.push('', IMPOSTAZIONI.azienda);
  return righe.join('\n');
}

// L'invio non manda niente: apre la posta con destinatario, oggetto e testo già
// scritti, e l'ultimo tocco resta di chi la usa. Per questo il lavoro si segna
// "in posta" e non "inviato" — l'app sa di averlo passato alla posta, non sa se
// è partito. E si segna prima di aprirla, o una mail mandata resterebbe senza
// traccia in archivio.
async function inviaConto(id) {
  const l = ARCHIVIO.find(x => x.id === id);
  if (!l) return;
  const cliente = CLIENTI.find(c => c.id === (l.cliente && l.cliente.id));
  const indirizzo = (cliente && cliente.email) || '';
  if (!indirizzo) {
    avvisa('Manca l\'email di ' + ((l.cliente && l.cliente.nome) || 'questo cliente') +
      ': mettila in Clienti, o scrivila a mano nella posta', true);
  }

  const aggiornato = { ...l, inPosta: new Date().toISOString() };
  delete aggiornato.anno;
  delete aggiornato.file;
  try {
    const radice = await sottocartella(CARTELLA, CARTELLA_ARCHIVIO, true);
    const cartellaAnno = await sottocartella(radice, l.anno, true);
    await scriviTesto(cartellaAnno, l.file, JSON.stringify(aggiornato, null, 2));
  } catch (e) {
    avvisa('Non ho potuto segnare l\'invio: ' + e.message, true);
    return;
  }
  l.inPosta = aggiornato.inPosta;

  const oggetto = 'Conto dei lavori' + (l.data ? ' del ' + formattaData(l.data) : '');
  apriPosta('mailto:' + encodeURIComponent(indirizzo) +
    '?subject=' + encodeURIComponent(oggetto) +
    '&body=' + encodeURIComponent(testoConto(l)));
  disegna();
}

// L'unico punto che porta fuori dall'app. Sta da solo per lo stesso motivo per
// cui ci sta usaCartella: aprire la posta è una cosa che un test non può fare.
function apriPosta(url) {
  window.location.href = url;
}

// ── PAGINA CLIENTI ──

let FILTRO_CLIENTI = '';

function disegnaClienti() {
  const c = document.getElementById('pagina-clienti');
  if (!CARTELLA) { c.innerHTML = schermataBenvenuto(); return; }

  let html = '<h2 class="titolo-pagina">Clienti</h2>';
  html += '<p class="sottotitolo">' + CLIENTI.length +
    (CLIENTI.length === 1 ? ' cliente' : ' clienti') + ' · telefono e mail stanno qui, il cantiere non li ha</p>';

  html += '<div id="clienti-da-salvare" class="avvertenza" style="display:' +
    (CLIENTI_DA_SALVARE ? 'block' : 'none') + '">' +
    'Ci sono modifiche non ancora scritte su file. Restano qui finché premi Salva.</div>';

  const mancanti = clientiMancanti();
  html += '<div class="scheda"><div class="bottoni" style="margin-top:0">' +
    '<button class="secondaria piccola" onclick="importaAnagrafica()"' +
      ' title="Legge anagrafica-dal-telefono.json dalla cartella">Importa dal telefono</button>' +
    (mancanti.length ? '<button class="secondaria piccola" onclick="prendiClientiDaiRapportini()">Aggiungi i ' +
      mancanti.length + ' visti nei rapportini</button>' : '') +
    '<button class="secondaria piccola" onclick="aggiungiCliente()">+ Aggiungi a mano</button>' +
    '<button class="principale piccola" onclick="salvaClienti()">Salva</button>' +
    '</div>' +
    '<div class="meta" style="margin-top:10px">Importare non sovrascrive: i clienti che ci sono già ' +
      'restano come li hai corretti, e arrivano solo quelli nuovi.</div>' +
    '</div>';

  html += '<div class="scheda"><input type="search" placeholder="Cerca un cliente" value="' +
    perValore(FILTRO_CLIENTI) + '" oninput="filtraClienti(this.value)"></div>';

  html += '<div id="elenco-clienti">' + righeClienti() + '</div>';
  c.innerHTML = html;
}

function righeClienti() {
  const filtro = FILTRO_CLIENTI.trim().toLowerCase();
  const elenco = CLIENTI
    .filter(c => !filtro || (c.nome + ' ' + c.citta).toLowerCase().includes(filtro))
    .sort((a, b) => String(a.nome).localeCompare(String(b.nome)));
  if (!elenco.length) {
    return '<div class="scheda"><div class="vuoto-elenco">' +
      (filtro ? 'Nessun cliente per questa ricerca.'
              : 'Anagrafica vuota. Importala dal telefono, o prendi i clienti dai rapportini arrivati.') +
      '</div></div>';
  }
  return elenco.map(c => {
    const id = perOnclick(c.id);
    const campo = (nome, etichetta, tipo) =>
      '<td><input type="' + (tipo || 'text') + '" placeholder="' + etichetta + '" value="' +
        perValore(c[nome]) + '" oninput="modificaCliente(\'' + id + '\', \'' + nome + '\', this.value)"></td>';
    return '<div class="scheda"><table class="elenco scheda-cliente"><tbody>' +
      '<tr>' + campo('nome', 'Nome') + campo('telefono', 'Telefono', 'tel') + '</tr>' +
      '<tr>' + campo('indirizzo', 'Indirizzo') + campo('citta', 'Città') + '</tr>' +
      '<tr>' + campo('email', 'Email', 'email') + campo('note', 'Note') + '</tr>' +
      '</tbody></table>' +
      '<div class="bottoni"><button class="pericolo piccola" onclick="eliminaCliente(\'' + id + '\')">Elimina</button></div>' +
    '</div>';
  }).join('');
}

// Come nell'archivio: ridisegnare tutto a ogni tasto farebbe perdere il fuoco.
function filtraClienti(valore) {
  FILTRO_CLIENTI = valore;
  const el = document.getElementById('elenco-clienti');
  if (el) el.innerHTML = righeClienti();
}

function aggiungiCliente() {
  CLIENTI.push(sistemaCliente({ nome: '' }));
  CLIENTI_DA_SALVARE = true;
  disegnaClienti();
}

function eliminaCliente(id) {
  const c = CLIENTI.find(x => x.id === id);
  if (!c) return;
  if (!confirm('Eliminare «' + (c.nome || 'senza nome') + '» dall\'anagrafica?')) return;
  CLIENTI = CLIENTI.filter(x => x.id !== id);
  CLIENTI_DA_SALVARE = true;
  disegnaClienti();
}

// I clienti che compaiono sui rapportini ma non in anagrafica: il cantiere li ha
// già scritti una volta, e farli ribattere sarebbe lavoro inventato.
function clientiMancanti() {
  const visti = new Map();
  const daDoc = r => {
    const c = r && r.cliente;
    if (!c || !c.id || CLIENTI.some(x => x.id === c.id) || visti.has(c.id)) return;
    visti.set(c.id, { id: c.id, nome: c.nome || '', indirizzo: c.indirizzo || '', citta: c.citta || '' });
  };
  ARRIVI.forEach(a => daDoc(a.doc));
  ARCHIVIO.forEach(l => daDoc(l.rapportino));
  return [...visti.values()];
}

async function prendiClientiDaiRapportini() {
